    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.55);
            --bg-glow: rgba(180, 220, 255, 0.1);
            --border-glow: rgba(255, 255, 255, 0.35);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #020202;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: none;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, #000000 130%);
            z-index: 45;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 50;
            background-size: 100% 6px, 6px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.015) 50%, transparent 100%);
            z-index: 46;
            pointer-events: none;
            animation: scanlineAnim 12s linear infinite;
        }

        @keyframes scanlineAnim {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }


        #photo-webs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 6;
            pointer-events: none;
            overflow: visible;
        }


        #photo-webs-container {
            perspective: 1500px;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
        }

        .photo-web-3d {
            position: absolute;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            object-fit: contain;
            object-position: center;
            transform-origin: center center;
            transform-style: preserve-3d;
            backface-visibility: visible;
            will-change: transform;
            perspective: 1500px;
            image-rendering: auto;
            opacity: 1;


            -webkit-mask-image: radial-gradient(ellipse 50% 50% at center,
                #000 8%, rgba(0,0,0,.8) 28%, rgba(0,0,0,.38) 50%,
                rgba(0,0,0,.09) 76%, transparent 100%);
            mask-image: radial-gradient(ellipse 50% 50% at center,
                #000 8%, rgba(0,0,0,.8) 28%, rgba(0,0,0,.38) 50%,
                rgba(0,0,0,.09) 76%, transparent 100%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            -webkit-mask-mode: alpha;
            mask-mode: alpha;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 95vw;
            height: 95vh;
            background: radial-gradient(circle, var(--glow-color) 0%, var(--bg-glow) 50%, rgba(0, 0, 0, 0) 80%);
            z-index: 4;
            pointer-events: none;
            will-change: transform, opacity;
            filter: blur(58px);
            contain: strict;
            transform: translate(-50%, -50%);
            opacity: 0.4;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)) 14px;
            gap: 12px;
            margin: 0 auto;
            box-sizing: border-box;
            will-change: transform, filter;
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 420px;
            height: clamp(180px, 32vh, 300px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 620px;
                height: clamp(260px, 38vh, 380px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
            filter: drop-shadow(0 0 40px var(--glow-color));
        }

        .status-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            padding: 0 4px;
        }

        .badge {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            padding: 7px 12px;
            border-radius: 40px;
            font-size: 9.5px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 14px var(--accent-color);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.1; transform: scale(0.3); }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
            pointer-events: auto;
        }

        .volume-control-box.disabled {
            pointer-events: none;
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        .volume-btn:active { transform: scale(0.8); }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        @media (max-width: 480px) {
            .status-bar { gap: 6px; }
            .badge { padding: 5px 9px; font-size: 8px; letter-spacing: 1px; }
            .volume-control-box { padding: 5px 9px; }
            .volume-slider { width: 38px; }
        }


        @media (max-width: 600px) {
            .now-playing-card {
                padding: 11px 12px;
                gap: 10px;
                align-items: center;
            }

            .track-info {
                flex: 1 1 58%;
                min-width: 0;
                max-width: 58%;
            }

            .next-track {
                flex: 1 1 38%;
                min-width: 0;
                max-width: 38%;
            }

            .track-title,
            #next-track-name {
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                overflow-wrap: anywhere;
                word-break: normal;
                line-height: 1.08;
            }

            .track-title {
                font-size: clamp(9px, 3.15vw, 13px);
                letter-spacing: 0.15px;
            }

            #next-track-name {
                display: block;
                font-size: clamp(7px, 2.45vw, 9px);
                text-align: right;
            }

            .track-label {
                font-size: 7px;
                letter-spacing: 1.25px;
            }
        }

        @media (max-width: 360px) {
            .now-playing-card { padding: 9px 10px; gap: 7px; }
            .track-title { font-size: clamp(8px, 3vw, 11px); }
            #next-track-name { font-size: clamp(6.5px, 2.35vw, 8px); }
        }

        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 140px;
            max-height: 38vh;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95);
            border: 1px solid var(--border-glow);
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #000;
            margin: 2px 0;
            will-change: transform;
        }



        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; pointer-events: auto;
        }

        .yt-shield-top-main { position: absolute; top: 0; left: 0; width: 100%; height: 82%; z-index: 15; background: transparent; }
        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 10, 0.96) 0%, rgba(0, 0, 0, 0.99) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .start-btn {
            background: var(--accent-color);
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 11px;
            padding: 16px 42px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 3.5px;
            box-shadow: 0 0 45px var(--accent-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .start-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 65px var(--accent-color);
        }

        .now-playing-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.95);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .next-track {
            font-size: 8.5px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .wave-bar {
            width: 2.5px;
            background: var(--accent-color);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--accent-color);
            animation: waveAnim 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 55%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }



        .badge, .volume-control-box, .now-playing-card, .video-container {
            isolation: isolate;
        }
        .badge::before, .volume-control-box::before, .now-playing-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(115deg, rgba(255,255,255,.09), transparent 28%, transparent 72%, rgba(255,255,255,.035));
            opacity: .55;
            z-index: -1;
        }
        .badge:hover, .volume-control-box:hover {
            transform: translateY(-1px);
            border-color: rgba(255,255,255,.58);
            box-shadow: 0 10px 34px rgba(0,0,0,.92), inset 0 0 16px rgba(255,255,255,.08);
        }
        .now-playing-card::after {
            content: "";
            position: absolute;
            left: 0; bottom: 0;
            width: var(--track-progress, 0%);
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,.25), #fff);
            box-shadow: 0 0 14px rgba(255,255,255,.65);
            transition: width .45s linear;
            pointer-events: none;
        }
        .track-time {
            margin-top: 2px;
            font-size: 7px;
            line-height: 1;
            letter-spacing: 1px;
            color: rgba(255,255,255,.42);
            font-variant-numeric: tabular-nums;
        }
        .video-container::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 14;
            pointer-events: none;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.035), inset 0 -40px 70px rgba(0,0,0,.18);
        }
        .start-btn:focus-visible, .volume-btn:focus-visible, .volume-slider:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }
        @media (prefers-reduced-motion: reduce) {
            .scanline-overlay, .live-dot, .start-btn::after, .wave-bar { animation: none !important; }
            .photo-web-3d { will-change: auto; }
        }


        :root { --mx:50vw; --my:50vh; --energy:.18; }
        body { background: radial-gradient(circle at 50% 42%, #101010 0%, #040404 36%, #000 78%); }
        body::before { background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.055), transparent 18%), radial-gradient(circle at 50% 45%, transparent 12%, #000 105%); transition: background .08s linear; }
        .main-wrapper { max-width: 760px; padding-left:18px; padding-right:18px; perspective:1200px; }
        .logo-container { filter: saturate(.9) contrast(1.08); transition: transform .22s ease-out; }
        #globe-3d-container canvas { filter: drop-shadow(0 0 26px rgba(255,255,255,.22)) drop-shadow(0 0 70px rgba(120,160,255,.10)); }
        .video-container, .now-playing-card, .badge, .volume-control-box { border-color: rgba(255,255,255,.16); background: linear-gradient(135deg, rgba(20,20,20,.82), rgba(4,4,4,.72)); box-shadow: 0 22px 70px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.06); }
        .video-container { border-radius:24px; transform:translateZ(0); }
        .video-container::before { content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px; background:linear-gradient(115deg, transparent 12%, rgba(255,255,255,.42) 33%, transparent 48%, rgba(255,255,255,.12) 72%, transparent 88%); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; z-index:20; pointer-events:none; opacity:.48; background-size:240% 100%; animation:edgeTravel 8s linear infinite; }
        @keyframes edgeTravel { to { background-position:240% 0; } }
        .now-playing-card { border-radius:22px; padding:16px 18px; }
        .status-bar { position:relative; z-index:20; }
        .badge,.volume-control-box { min-height:32px; }
        .start-btn { padding:16px 44px; min-width:170px; border-radius:999px; letter-spacing:3.2px; clip-path:none; background:linear-gradient(135deg,#fff 0%,#dcdcdc 48%,#fff 100%); border:1px solid rgba(255,255,255,.9); box-shadow:0 10px 34px rgba(0,0,0,.58),0 0 24px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 8px rgba(0,0,0,.14); }
        .start-btn::before { content:""; position:absolute; inset:4px; border-radius:inherit; border:1px solid rgba(0,0,0,.13); pointer-events:none; }
        .start-btn:hover { transform:translateY(-2px) scale(1.035); box-shadow:0 16px 42px rgba(0,0,0,.68),0 0 34px rgba(255,255,255,.24),inset 0 1px 0 #fff; }
        .start-btn:active { transform:translateY(0) scale(.985); }
        .reg-mark { display:inline-block; font-size:.34em; vertical-align:top; margin-left:.08em; transform:translateY(.05em); letter-spacing:0; }
        .ambient-glow { background:radial-gradient(circle at 50% 48%, rgba(255,255,255,.11), rgba(100,140,255,.035) 35%, transparent 68%); filter:blur(70px); opacity:.65; transform:translate(-50%,-50%) scale(calc(1 + var(--energy))); }
        #fx-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:5; pointer-events:none; opacity:.8; }
        .control-dock { position:fixed; right:18px; bottom:18px; z-index:70; display:flex; gap:8px; }
        .dock-btn { width:38px; height:38px; border:1px solid rgba(255,255,255,.18); border-radius:12px; background:rgba(8,8,8,.72); color:#fff; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); cursor:pointer; display:grid; place-items:center; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.45); transition:.2s ease; }
        .dock-btn:hover { transform:translateY(-3px) scale(1.05); border-color:rgba(255,255,255,.5); box-shadow:0 14px 35px rgba(0,0,0,.6),0 0 22px rgba(255,255,255,.08); }
        .boot { position:fixed; inset:0; z-index:999; background:#000; display:grid; place-items:center; transition:opacity .7s ease,visibility .7s ease; }
        .boot.out { opacity:0; visibility:hidden; }
        .boot-mark { font-family:'Syne',sans-serif; font-size:clamp(34px,8vw,74px); font-weight:900; letter-spacing:.18em; padding-left:.18em; color:#fff; text-shadow:0 0 35px rgba(255,255,255,.3); animation:bootPulse .8s ease-in-out infinite alternate; }
        @keyframes bootPulse { from{opacity:.28;filter:blur(2px);transform:scale(.985)} to{opacity:1;filter:blur(0);transform:scale(1)} }
        body.playing .video-container { box-shadow:0 24px 80px rgba(0,0,0,.68),0 0 45px rgba(255,255,255,.055),inset 0 1px 0 rgba(255,255,255,.08); }
        body.playing .now-playing-card { box-shadow:0 18px 55px rgba(0,0,0,.7),0 0 26px rgba(255,255,255,.04); }
        @media(max-width:700px){ .control-dock{right:10px;bottom:10px}.dock-btn{width:34px;height:34px}.main-wrapper{padding-left:10px;padding-right:10px}.video-container{border-radius:18px}.now-playing-card{border-radius:16px} }

        body{background:#010101;}

        const STREAM_START_TIME = 1700000000;

        function seededShuffle(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;

            const pseudorandom = function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            };

            while (m) {
                i = Math.floor(pseudorandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const totalElapsed = Math.max(0, nowInSeconds - STREAM_START_TIME);

            const cycleIndex = Math.floor(totalElapsed / totalPlaylistDuration);
            const elapsedTime = totalElapsed % totalPlaylistDuration;

            const currentPlaylist = seededShuffle(baseSongList, cycleIndex + 42);

            let accumulatedTime = 0;
            for (let i = 0; i < currentPlaylist.length; i++) {
                if (elapsedTime < accumulatedTime + currentPlaylist[i].duration) {
                    return {
                        playlist: currentPlaylist,
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += currentPlaylist[i].duration;
            }
            return { playlist: currentPlaylist, songIndex: 0, seekTo: 0 };

            if(video && !video.querySelector('.rev-video-frame')){
                const frame=document.createElement('div');
                frame.className='rev-video-frame';
                frame.setAttribute('aria-hidden','true');
                frame.innerHTML='<i class="rail top"></i><i class="rail right"></i><i class="rail bottom"></i><i class="rail left"></i><b class="node n1"></b><b class="node n2"></b><b class="node n3"></b><b class="node n4"></b>';
                video.appendChild(frame);
            }
        })();

        (function revolutionSilkEngine(){
            const canvas=document.getElementById('rev-silk');
            if(!canvas) return;
            const ctx=canvas.getContext('2d',{alpha:true});
            let W=0,H=0,D=1,stars=[],rays=[],lastCenterX=innerWidth/2,lastCenterY=innerHeight*.3;
            const rayCount=22;
            function resize(){
                D=Math.min(devicePixelRatio||1,1.45);W=innerWidth;H=innerHeight;
                canvas.width=Math.max(1,Math.floor(W*D));canvas.height=Math.max(1,Math.floor(H*D));
                canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);
                rays=Array.from({length:rayCount},(_,i)=>({a:(i/rayCount)*Math.PI*2+Math.random()*.12,phase:Math.random()*Math.PI*2,w:.35+Math.random()*.6,s:.75+Math.random()*.8}));
                const count=Math.min(95,Math.max(45,Math.floor(W*H/18000)));
                stars=Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random(),p:Math.random()*6.28,v:.12+Math.random()*.4}));
            }
            function center(){
                const globe=document.getElementById('globe-3d-container');
                if(globe){const r=globe.getBoundingClientRect();lastCenterX=r.left+r.width/2;lastCenterY=r.top+r.height/2;}
                document.documentElement.style.setProperty('--rev-center-x',lastCenterX+'px');
                document.documentElement.style.setProperty('--rev-center-y',lastCenterY+'px');
            }
            resize();center();addEventListener('resize',()=>{resize();center()},{passive:true});
            let lastCenterSample=0;
            function edgePoint(a,scale=1){
                const dx=Math.cos(a),dy=Math.sin(a),cx=lastCenterX,cy=lastCenterY;
                const tx=dx>0?(W-cx)/dx:dx<0?(0-cx)/dx:1e9;
                const ty=dy>0?(H-cy)/dy:dy<0?(0-cy)/dy:1e9;
                const t=Math.min(Math.abs(tx),Math.abs(ty))*scale;
                return [cx+dx*t,cy+dy*t];
            }
            function draw(ms){
                if(document.hidden){requestAnimationFrame(draw);return;}
                if(ms-lastCenterSample>500){center();lastCenterSample=ms;}
                ctx.clearRect(0,0,W,H);
                const live=document.body.classList.contains('playing');
                window.__revBurst=Math.max(0,(window.__revBurst||0)-.014);
                const burst=window.__revBurst||0;
                const cx=lastCenterX,cy=lastCenterY;

                ctx.save();ctx.globalCompositeOperation='lighter';
                for(let i=0;i<rays.length;i++){
                    const r=rays[i];
                    const wob=Math.sin(ms*.00032*r.s+r.phase)*.018;
                    const a=r.a+wob;
                    const [ex,ey]=edgePoint(a,1.08);
                    const nx=-Math.sin(a),ny=Math.cos(a);
                    const bend=Math.sin(ms*.00055+r.phase)*26*(live?1.6:1);
                    const mx=(cx+ex)/2+nx*bend,my=(cy+ey)/2+ny*bend;
                    const alpha=(live?.07:.028)+(burst*.16);
                    ctx.strokeStyle=`rgba(255,255,255,${alpha})`;
                    ctx.lineWidth=r.w+(burst*.7);
                    ctx.beginPath();ctx.moveTo(cx,cy);ctx.quadraticCurveTo(mx,my,ex,ey);ctx.stroke();

                    if((i%3)===0){
                        const t=((ms*.00008*r.s+r.phase)%1+1)%1;
                        const omt=1-t;
                        const px=omt*omt*cx+2*omt*t*mx+t*t*ex;
                        const py=omt*omt*cy+2*omt*t*my+t*t*ey;
                        ctx.fillStyle=`rgba(255,255,255,${(live?.65:.28)+burst*.25})`;
                        ctx.beginPath();ctx.arc(px,py,live?1.1:.65,0,Math.PI*2);ctx.fill();
                    }
                }

                for(const s of stars){
                    s.z+=(live?.0026:.0011)*s.v;if(s.z>1){s.z=0;s.x=Math.random()*W;s.y=Math.random()*H;}
                    const dx=s.x-cx,dy=s.y-cy;
                    const px=cx+dx*(.5+s.z*.7),py=cy+dy*(.5+s.z*.7);
                    const a=(.06+s.z*.22)*(live?1.35:1)+burst*.18;
                    ctx.fillStyle=`rgba(255,255,255,${a})`;
                    ctx.beginPath();ctx.arc(px,py,.3+s.z*.9,0,Math.PI*2);ctx.fill();
                }

                const pulse=.5+.5*Math.sin(ms*(live?.0028:.0014));
                const radius=(Math.min(W,H)*(live?.14:.11))*(1+burst*.7);
                const g=ctx.createRadialGradient(cx,cy,0,cx,cy,radius*1.9);
                g.addColorStop(0,`rgba(255,255,255,${.035+(live?.035:0)+burst*.12})`);
                g.addColorStop(.45,`rgba(255,255,255,${.012+pulse*.012})`);g.addColorStop(1,'rgba(255,255,255,0)');
                ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,radius*1.9,0,Math.PI*2);ctx.fill();
                ctx.restore();
                requestAnimationFrame(draw);
            }
            requestAnimationFrame(draw);
        })();

        const revTitleObserver=new MutationObserver(()=>{
            if(!userHasClicked)return;
            document.body.classList.remove('song-pulse');void document.body.offsetWidth;document.body.classList.add('song-pulse');
            window.__revBurst=Math.max(window.__revBurst||0,.32);
            setTimeout(()=>document.body.classList.remove('song-pulse'),980);
        });
        revTitleObserver.observe(currentTrackEl,{childList:true,characterData:true,subtree:true});

    </script>
