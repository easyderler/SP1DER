<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EA$Y FM | 7/24 YÜZDE YÜZ MÜZİK</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Montserrat:wght@700;900&family=Permanent+Marker&family=Pirata+One&family=Rubik+Glitch&family=Space+Grotesk:wght@500;700;900&family=Syne:wght@800;900&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.55);
            --bg-glow: rgba(180, 220, 255, 0.1);
            --border-glow: rgba(255, 255, 255, 0.35);
            --bass-scale: 1;
            --bass-glow-scale: 1;
            --bass-opacity: 0.55;
            --glitch-x: 0px;
            --glitch-y: 0px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #020202;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: none;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, #000000 130%);
            z-index: 45;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 50;
            background-size: 100% 6px, 6px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.015) 50%, transparent 100%);
            z-index: 46;
            pointer-events: none;
            animation: scanlineAnim 12s linear infinite;
        }

        @keyframes scanlineAnim {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* Trap / Hiphop Arkaplan Yazı Kapsayıcısı */
        #gothic-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .random-gothic-text {
            position: absolute;
            color: rgba(255, 255, 255, 0.04);
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.06);
            will-change: transform, opacity;
            text-transform: uppercase;
            letter-spacing: 2px;
            user-select: none;
            transition: opacity 0.8s ease-in-out;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 95vw;
            height: 95vh;
            background: radial-gradient(circle, var(--glow-color) 0%, var(--bg-glow) 50%, rgba(0, 0, 0, 0) 80%);
            z-index: 4;
            pointer-events: none;
            will-change: transform, opacity;
            filter: blur(70px);
            transform: translate(-50%, -50%) scale(var(--bass-glow-scale));
            opacity: var(--bass-opacity);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)) 14px;
            gap: 12px;
            margin: 0 auto;
            box-sizing: border-box;
            will-change: transform, filter;
        }

        .wrapper-shake {
            animation: trapBassShake 0.07s ease-in-out infinite alternate;
        }

        .wrapper-glitch {
            filter: drop-shadow(-6px 0 0px rgba(255, 0, 50, 0.9)) drop-shadow(6px 0 0px rgba(0, 240, 255, 0.9)) !important;
            transform: translate(var(--glitch-x), var(--glitch-y)) scale(1.02) !important;
        }

        @keyframes trapBassShake {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.008) translate(-1.5px, 1.5px); }
            100% { transform: scale(0.992) translate(1.5px, -1.5px); }
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 420px;
            height: clamp(180px, 32vh, 300px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 620px;
                height: clamp(260px, 38vh, 380px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
            filter: drop-shadow(0 0 40px var(--glow-color));
        }

        .status-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            padding: 0 4px;
        }

        .badge {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            padding: 7px 12px;
            border-radius: 40px;
            font-size: 9.5px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .theme-selector {
            display: flex;
            gap: 6px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-glow);
            padding: 6px 10px;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .theme-btn {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
            position: relative;
        }

        .theme-btn:active {
            transform: scale(0.6);
        }

        .theme-ice { background: #ffffff; box-shadow: 0 0 14px #fff; }
        .theme-slime { background: #39ff14; box-shadow: 0 0 14px #39ff14; }
        .theme-opium { background: #ff0000; box-shadow: 0 0 14px #ff0000; }
        .theme-purple { background: #a855f7; box-shadow: 0 0 14px #a855f7; }
        .theme-gold { background: #ffd700; box-shadow: 0 0 14px #ffd700; }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 14px var(--accent-color);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.1; transform: scale(0.3); }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            pointer-events: auto;
        }

        .volume-control-box.disabled {
            pointer-events: none;
        }

        .badge-bass-pulse {
            transform: scale(1.04);
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 22px var(--glow-color) !important;
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        
        .volume-btn:active { transform: scale(0.8); }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        @media (max-width: 480px) {
            .status-bar { gap: 6px; }
            .badge { padding: 5px 9px; font-size: 8px; letter-spacing: 1px; }
            .theme-selector { padding: 5px 8px; gap: 4px; }
            .theme-btn { width: 13px; height: 13px; }
            .volume-control-box { padding: 5px 9px; }
            .volume-slider { width: 38px; }
        }

        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 140px;
            max-height: 38vh;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95);
            border: 1px solid var(--border-glow);
            transition: border-color 0.3s, box-shadow 0.3s;
            transform: scale(var(--bass-scale));
            background: #000;
            margin: 2px 0;
            will-change: transform;
        }

        .video-container.playing-border {
            border-color: var(--accent-color);
            box-shadow: 0 0 40px var(--glow-color), inset 0 0 25px var(--glow-color);
        }

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; pointer-events: auto;
        }

        .yt-shield-top-main { position: absolute; top: 0; left: 0; width: 100%; height: 82%; z-index: 15; background: transparent; }
        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 10, 0.96) 0%, rgba(0, 0, 0, 0.99) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .start-btn {
            background: var(--accent-color);
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 11px;
            padding: 16px 42px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 3.5px;
            box-shadow: 0 0 45px var(--accent-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .start-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 65px var(--accent-color);
        }

        .now-playing-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.95);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .next-track {
            font-size: 8.5px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .wave-bar {
            width: 2.5px;
            background: var(--accent-color);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--accent-color);
            animation: waveAnim 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 55%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="scanline-overlay"></div>

    <!-- Trap / Hiphop Estetik Arkaplan Kapsayıcısı -->
    <div id="gothic-bg-container"></div>

    <canvas id="bg-canvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="main-wrapper" id="main-wrapper">
        <div class="logo-container">
            <div id="globe-3d-container"></div>
        </div>

        <div class="status-bar">
            <div class="badge" id="badge-live">
                <span class="live-dot"></span>
                <span>CANLI</span>
            </div>
            <div class="badge" id="badge-listener">
                <span>🎧 DİNLEYİCİ: <strong id="listener-count" style="color: #ffffff; text-shadow:0 0 10px #fff;">1</strong></span>
            </div>
            <div class="theme-selector" id="theme-selector-box">
                <div class="theme-btn theme-ice" onclick="setRadioTheme('ICE')" title="ICE White"></div>
                <div class="theme-btn theme-slime" onclick="setRadioTheme('SLIME')" title="SLIME Green"></div>
                <div class="theme-btn theme-opium" onclick="setRadioTheme('OPIUM')" title="OPIUM Red"></div>
                <div class="theme-btn theme-purple" onclick="setRadioTheme('PURPLE')" title="LEAN Purple"></div>
                <div class="theme-btn theme-gold" onclick="setRadioTheme('GOLD')" title="CHAMPAGNE Gold"></div>
            </div>
            <div class="volume-control-box disabled" id="volume-box">
                <button class="volume-btn" id="mute-btn" disabled>🔊</button>
                <input type="range" class="volume-slider" id="volume-range" min="0" max="100" value="100" disabled>
            </div>
        </div>

        <div class="video-container" id="video-box">
            <div class="yt-shield-top-main"></div>
            <div class="yt-shield-bottom-left"></div>
            <div class="yt-shield-bottom-edge"></div>

            <div id="start-overlay">
                <button class="start-btn" id="start-btn-el">CANLI YAYINA KATIL</button>
            </div>
            <div id="youtube-player"></div>
        </div>

        <div class="now-playing-card">
            <div class="track-info">
                <span class="track-label">
                    <span style="display:inline-block; width:6px; height:6px; background:var(--accent-color); border-radius:50%; box-shadow:0 0 10px var(--accent-color);"></span>
                    YAYINDA
                    <div class="wave-bars" id="wave-bars">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </span>
                <span class="track-title" id="current-track-name">Canlı Yayın Bekleniyor...</span>
            </div>
            <div class="next-track">
                <div class="track-label" style="justify-content: flex-end;">SIRADAKİ</div>
                <span id="next-track-name" style="font-weight:700;">---</span>
            </div>
        </div>
    </div>

    <script>
        // --- TRAP & HIPHOP ESTETİK ARKA PLAN YAZILARI OLUŞTURUCU ---
        const gothicWords = [
            "EA$Y FM", "OPIUM 808", "TRAPHOUSE", "YSL", "WORLDWIDE", 
            "CACTUS JACK", "00VOX", "NARCISSIST", "WHOLE LOTTA", "NO STYLIST",
            "999", "RAGE", "FE!N", "CARTI"
        ];

        function generateRandomGothicBg() {
            const container = document.getElementById('gothic-bg-container');
            container.innerHTML = '';
            
            const count = window.innerWidth < 600 ? 8 : 14;

            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'random-gothic-text';
                
                const word = gothicWords[Math.floor(Math.random() * gothicWords.length)];
                el.innerText = word;

                const top = Math.random() * 92; 
                const left = Math.random() * 85 - 5; 
                const fontSize = (Math.random() * 5 + 3.5).toFixed(1) + 'vw'; 
                const rotation = Math.floor(Math.random() * 50 - 25); 
                const opacity = (Math.random() * 0.035 + 0.02).toFixed(3); 

                const fontChoices = [
                    "'Rubik Glitch', display",
                    "'UnifrakturMaguntia', serif", 
                    "'Pirata One', cursive",
                    "'Permanent Marker', cursive",
                    "'Dela Gothic One', sans-serif"
                ];
                const chosenFont = fontChoices[Math.floor(Math.random() * fontChoices.length)];

                el.style.top = top + '%';
                el.style.left = left + '%';
                el.style.fontSize = fontSize;
                el.style.fontFamily = chosenFont;
                el.style.opacity = opacity;
                el.style.transform = `rotate(${rotation}deg) scale(var(--bass-scale))`;

                container.appendChild(el);
            }
        }

        generateRandomGothicBg();

        let currentAccentColor = '#ffffff';
        const THEMES = {
            ICE: { accent: '#ffffff', glow: 'rgba(255, 255, 255, 0.55)', bgGlow: 'rgba(180, 220, 255, 0.1)', borderGlow: 'rgba(255, 255, 255, 0.35)' },
            SLIME: { accent: '#39ff14', glow: 'rgba(57, 255, 20, 0.6)', bgGlow: 'rgba(0, 255, 50, 0.12)', borderGlow: 'rgba(57, 255, 20, 0.4)' },
            OPIUM: { accent: '#ff0000', glow: 'rgba(255, 0, 0, 0.65)', bgGlow: 'rgba(255, 0, 0, 0.12)', borderGlow: 'rgba(255, 0, 0, 0.4)' },
            PURPLE: { accent: '#a855f7', glow: 'rgba(168, 85, 247, 0.65)', bgGlow: 'rgba(168, 85, 247, 0.12)', borderGlow: 'rgba(168, 85, 247, 0.4)' },
            GOLD: { accent: '#ffd700', glow: 'rgba(255, 215, 0, 0.65)', bgGlow: 'rgba(255, 215, 0, 0.12)', borderGlow: 'rgba(255, 215, 0, 0.4)' }
        };

        function setRadioTheme(mode) {
            const t = THEMES[mode];
            currentAccentColor = t.accent;
            const rootStyle = document.documentElement.style;
            rootStyle.setProperty('--accent-color', t.accent);
            rootStyle.setProperty('--glow-color', t.glow);
            rootStyle.setProperty('--bg-glow', t.bgGlow);
            rootStyle.setProperty('--border-glow', t.borderGlow);

            if (ringBarMeshes) {
                const hexColor = parseInt(t.accent.replace('#', '0x'));
                ringBarMeshes.forEach(b => b.material.color.setHex(hexColor));
            }
        }

        let player = null;
        let isPlayerReady = false;
        let isPlayingState = false;
        let actualPlayerStatePlaying = false; 
        let currentLoadedVideoId = null;
        let syncCheckInterval = null;
        let userHasClicked = false;

        const baseSongList = [
            { id: '1IEg_3x35go', duration: 120, title: 'FRANCHISE' },
            { id: 'qAlF70MdfwU', duration: 207, title: 'OUT WEST' }, 
            { id: 'L_BpiSsIBFM', duration: 236, title: 'BROTHER STONE' }, 
            { id: 'cTGQrA5HHIU', duration: 204, title: 'WITH THAT' },

        const STREAM_START_TIME = 1700000000;

        function seededShuffle(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;

            const pseudorandom = function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            };

            while (m) {
                i = Math.floor(pseudorandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

        const totalPlaylistDuration = baseSongList.reduce((acc, song) => acc + song.duration, 0);

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const totalElapsed = Math.max(0, nowInSeconds - STREAM_START_TIME);

            const cycleIndex = Math.floor(totalElapsed / totalPlaylistDuration);
            const elapsedTime = totalElapsed % totalPlaylistDuration;

            const currentPlaylist = seededShuffle(baseSongList, cycleIndex + 42);

            let accumulatedTime = 0;
            for (let i = 0; i < currentPlaylist.length; i++) {
                if (elapsedTime < accumulatedTime + currentPlaylist[i].duration) {
                    return {
                        playlist: currentPlaylist,
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += currentPlaylist[i].duration;
            }
            return { playlist: currentPlaylist, songIndex: 0, seekTo: 0 };
        }

        const currentTrackEl = document.getElementById('current-track-name');
        const nextTrackEl = document.getElementById('next-track-name');

        function updateTrackLabels(playlist, currentIndex) {
            const currentSong = playlist[currentIndex];
            const nextIndex = (currentIndex + 1) % playlist.length;
            const nextSong = playlist[nextIndex];

            if (currentTrackEl.innerText !== currentSong.title) currentTrackEl.innerText = currentSong.title;
            if (nextTrackEl.innerText !== nextSong.title) nextTrackEl.innerText = nextSong.title;
        }

        const initialState = getCurrentStreamState();
        updateTrackLabels(initialState.playlist, initialState.songIndex);

        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            const targetSong = state.playlist[state.songIndex];
            currentLoadedVideoId = targetSong.id;

            player = new YT.Player('youtube-player', {
                videoId: targetSong.id,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'iv_load_policy': 3,
                    'fs': 0,
                    'start': Math.floor(state.seekTo),
                    'mute': 1
                },
                events: {
                    'onReady': () => { 
                        isPlayerReady = true; 
                        if (player && typeof player.playVideo === 'function') {
                            player.playVideo();
                        }
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function updateAudioVisualState() {
            const vol = Number(volumeRange.value);

            if (!userHasClicked || vol === 0 || isMuted || !actualPlayerStatePlaying) {
                isPlayingState = false;
                vBox.classList.remove('playing-border');
                waveBars.style.opacity = '0';
                mainWrapper.classList.remove('wrapper-shake');
            } else {
                isPlayingState = true;
                vBox.classList.add('playing-border');
                waveBars.style.opacity = '1';
                mainWrapper.classList.add('wrapper-shake');
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                actualPlayerStatePlaying = true;
            } else if (event.data === YT.PlayerState.ENDED) {
                actualPlayerStatePlaying = false;
                syncToLiveStream();
            } else {
                actualPlayerStatePlaying = false;
            }
            updateAudioVisualState();
        }

        function syncToLiveStream() {
            if (!isPlayerReady || !player || !userHasClicked) return;

            const state = getCurrentStreamState();
            const targetSong = state.playlist[state.songIndex];

            updateTrackLabels(state.playlist, state.songIndex);

            if (currentLoadedVideoId !== targetSong.id) {
                currentLoadedVideoId = targetSong.id;
                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();
                return;
            }

            if (typeof player.getCurrentTime === 'function') {
                const currentTime = player.getCurrentTime();
                const timeDiff = Math.abs(currentTime - state.seekTo);
                
                if (timeDiff > 2.0) {
                    player.seekTo(state.seekTo, true);
                    if (typeof player.getPlayerState === 'function' && player.getPlayerState() !== YT.PlayerState.PLAYING) {
                        player.playVideo();
                    }
                }
            }
        }

                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

        }
