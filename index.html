<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SP1DER | 7/24 YÜZDE YÜZ MÜZİK</title>
    <meta name="theme-color" content="#020202">
    <meta name="color-scheme" content="dark">
    <link rel="preload" as="image" href="https://i.hizliresim.com/av8t7brd.png" fetchpriority="high">
    <link rel="preload" as="image" href="https://i.hizliresim.com/xllwx1bt.png" fetchpriority="high">
    <link rel="preload" as="image" href="https://i.hizliresim.com/tcbusgul.png" fetchpriority="high">
    <link rel="preload" as="image" href="https://i.hizliresim.com/bhocuany.png" fetchpriority="high">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Space+Grotesk:wght@500;700;900&family=Syne:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.55);
            --bg-glow: rgba(180, 220, 255, 0.1);
            --border-glow: rgba(255, 255, 255, 0.35);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #020202;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: none;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, #000000 130%);
            z-index: 45;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 50;
            background-size: 100% 6px, 6px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.015) 50%, transparent 100%);
            z-index: 46;
            pointer-events: none;
            animation: scanlineAnim 12s linear infinite;
        }

        @keyframes scanlineAnim {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        
        #photo-webs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 6;
            pointer-events: none;
            overflow: visible;
        }

        
        #photo-webs-container {
            perspective: 1500px;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
        }

        .photo-web-3d {
            position: absolute;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            object-fit: contain;
            object-position: center;
            transform-origin: center center;
            transform-style: preserve-3d;
            backface-visibility: visible;
            will-change: transform;
            perspective: 1500px;
            image-rendering: auto;
            opacity: 1;

            
            -webkit-mask-image: radial-gradient(ellipse 50% 50% at center,
                #000 8%, rgba(0,0,0,.8) 28%, rgba(0,0,0,.38) 50%,
                rgba(0,0,0,.09) 76%, transparent 100%);
            mask-image: radial-gradient(ellipse 50% 50% at center,
                #000 8%, rgba(0,0,0,.8) 28%, rgba(0,0,0,.38) 50%,
                rgba(0,0,0,.09) 76%, transparent 100%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            -webkit-mask-mode: alpha;
            mask-mode: alpha;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 95vw;
            height: 95vh;
            background: radial-gradient(circle, var(--glow-color) 0%, var(--bg-glow) 50%, rgba(0, 0, 0, 0) 80%);
            z-index: 4;
            pointer-events: none;
            will-change: transform, opacity;
            filter: blur(58px);
            contain: strict;
            transform: translate(-50%, -50%);
            opacity: 0.4;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)) 14px;
            gap: 12px;
            margin: 0 auto;
            box-sizing: border-box;
            will-change: transform, filter;
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 420px;
            height: clamp(180px, 32vh, 300px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 620px;
                height: clamp(260px, 38vh, 380px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
            filter: drop-shadow(0 0 40px var(--glow-color));
        }

        .status-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            padding: 0 4px;
        }

        .badge {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            padding: 7px 12px;
            border-radius: 40px;
            font-size: 9.5px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 14px var(--accent-color);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.1; transform: scale(0.3); }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
            pointer-events: auto;
        }

        .volume-control-box.disabled {
            pointer-events: none;
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        
        .volume-btn:active { transform: scale(0.8); }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        @media (max-width: 480px) {
            .status-bar { gap: 6px; }
            .badge { padding: 5px 9px; font-size: 8px; letter-spacing: 1px; }
            .volume-control-box { padding: 5px 9px; }
            .volume-slider { width: 38px; }
        }

        
        @media (max-width: 600px) {
            .now-playing-card {
                padding: 11px 12px;
                gap: 10px;
                align-items: center;
            }

            .track-info {
                flex: 1 1 58%;
                min-width: 0;
                max-width: 58%;
            }

            .next-track {
                flex: 1 1 38%;
                min-width: 0;
                max-width: 38%;
            }

            .track-title,
            #next-track-name {
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                overflow-wrap: anywhere;
                word-break: normal;
                line-height: 1.08;
            }

            .track-title {
                font-size: clamp(9px, 3.15vw, 13px);
                letter-spacing: 0.15px;
            }

            #next-track-name {
                display: block;
                font-size: clamp(7px, 2.45vw, 9px);
                text-align: right;
            }

            .track-label {
                font-size: 7px;
                letter-spacing: 1.25px;
            }
        }

        @media (max-width: 360px) {
            .now-playing-card { padding: 9px 10px; gap: 7px; }
            .track-title { font-size: clamp(8px, 3vw, 11px); }
            #next-track-name { font-size: clamp(6.5px, 2.35vw, 8px); }
        }

        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 140px;
            max-height: 38vh;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95);
            border: 1px solid var(--border-glow);
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #000;
            margin: 2px 0;
            will-change: transform;
        }

        

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; pointer-events: auto;
        }

        .yt-shield-top-main { position: absolute; top: 0; left: 0; width: 100%; height: 82%; z-index: 15; background: transparent; }
        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 10, 0.96) 0%, rgba(0, 0, 0, 0.99) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .start-btn {
            background: var(--accent-color);
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 11px;
            padding: 16px 42px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 3.5px;
            box-shadow: 0 0 45px var(--accent-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .start-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 65px var(--accent-color);
        }

        .now-playing-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.95);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .next-track {
            font-size: 8.5px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .wave-bar {
            width: 2.5px;
            background: var(--accent-color);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--accent-color);
            animation: waveAnim 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 55%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }


        
        .badge, .volume-control-box, .now-playing-card, .video-container {
            isolation: isolate;
        }
        .badge::before, .volume-control-box::before, .now-playing-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(115deg, rgba(255,255,255,.09), transparent 28%, transparent 72%, rgba(255,255,255,.035));
            opacity: .55;
            z-index: -1;
        }
        .badge:hover, .volume-control-box:hover {
            transform: translateY(-1px);
            border-color: rgba(255,255,255,.58);
            box-shadow: 0 10px 34px rgba(0,0,0,.92), inset 0 0 16px rgba(255,255,255,.08);
        }
        .now-playing-card::after {
            content: "";
            position: absolute;
            left: 0; bottom: 0;
            width: var(--track-progress, 0%);
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,.25), #fff);
            box-shadow: 0 0 14px rgba(255,255,255,.65);
            transition: width .45s linear;
            pointer-events: none;
        }
        .track-time {
            margin-top: 2px;
            font-size: 7px;
            line-height: 1;
            letter-spacing: 1px;
            color: rgba(255,255,255,.42);
            font-variant-numeric: tabular-nums;
        }
        .video-container::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 14;
            pointer-events: none;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.035), inset 0 -40px 70px rgba(0,0,0,.18);
        }
        .start-btn:focus-visible, .volume-btn:focus-visible, .volume-slider:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }
        @media (prefers-reduced-motion: reduce) {
            .scanline-overlay, .live-dot, .start-btn::after, .wave-bar { animation: none !important; }
            .photo-web-3d { will-change: auto; }
        }

    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="scanline-overlay"></div>

    
    <div id="photo-webs-container"></div>

    <div class="ambient-glow"></div>

    <div class="main-wrapper" id="main-wrapper">
        <div class="logo-container">
            <div id="globe-3d-container"></div>
        </div>

        <div class="status-bar">
            <div class="badge" id="badge-live">
                <span class="live-dot"></span>
                <span>CANLI</span>
            </div>
            <div class="badge" id="badge-listener">
                <span>🎧 DİNLEYİCİ: <strong id="listener-count" style="color: #ffffff; text-shadow:0 0 10px #fff;">1</strong></span>
            </div>
            <div class="volume-control-box disabled" id="volume-box">
                <button class="volume-btn" id="mute-btn" type="button" aria-label="Sesi kapat" disabled>🔊</button>
                <input type="range" class="volume-slider" id="volume-range" min="0" max="100" value="100" aria-label="Ses seviyesi" disabled>
            </div>
        </div>

        <div class="video-container" id="video-box">
            <div class="yt-shield-top-main"></div>
            <div class="yt-shield-bottom-left"></div>
            <div class="yt-shield-bottom-edge"></div>

            <div id="start-overlay">
                <button class="start-btn" id="start-btn-el" type="button">CANLI YAYINA KATIL</button>
            </div>
            <div id="youtube-player"></div>
        </div>

        <div class="now-playing-card">
            <div class="track-info">
                <span class="track-label">
                    <span style="display:inline-block; width:6px; height:6px; background:var(--accent-color); border-radius:50%; box-shadow:0 0 10px var(--accent-color);"></span>
                    YAYINDA
                    <div class="wave-bars" id="wave-bars">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </span>
                <span class="track-title" id="current-track-name">Canlı Yayın Bekleniyor...</span>
                <span class="track-time" id="track-time" aria-live="off">--:-- / --:--</span>
            </div>
            <div class="next-track">
                <div class="track-label" style="justify-content: flex-end;">SIRADAKİ</div>
                <span id="next-track-name" style="font-weight:700;">---</span>
            </div>
        </div>
    </div>

    <script>

        const photoWebsContainer = document.getElementById('photo-webs-container');

        const realWebImages = [
            "https://i.hizliresim.com/av8t7brd.png",
            "https://i.hizliresim.com/xllwx1bt.png",
            "https://i.hizliresim.com/tcbusgul.png",
            "https://i.hizliresim.com/bhocuany.png",
            "https://i.hizliresim.com/bkslqch8.png"
        ];

        let photoWebElements = [];
        let webAnimationTime = 0;

        function randomBetween(a, b) {
            return a + Math.random() * (b - a);
        }

        const webPositions = [
            [18, 18], [82, 18], [18, 82], [82, 82], [50, 50]
        ];

        function clearPhotoWebs() {
            photoWebElements.forEach(item => {
                if (item.el && item.el.parentNode) item.el.parentNode.removeChild(item.el);
            });
            photoWebElements = [];
        }

        function createWebElement(src, index) {
            const img = document.createElement('img');
            img.className = 'photo-web-3d';
            img.src = src;
            img.alt = '';
            img.decoding = 'async';
            img.loading = 'eager';
            img.fetchPriority = 'high';
            img.draggable = false;
            img.setAttribute('aria-hidden', 'true');

            const mobile = window.innerWidth < 600;

            const item = {
                el: img,
                left: webPositions[index][0],
                top: webPositions[index][1],
                depth: randomBetween(-80, 90),

                width: mobile ? randomBetween(60, 72) : randomBetween(52, 66),

                rotX: randomBetween(-4, 4),
                rotY: randomBetween(-7, 7),
                rotZ: randomBetween(-28, 28),
                scale: randomBetween(0.92, 1.08),

                phase: Math.random() * Math.PI * 2,
                speed: randomBetween(0.9, 1.35),
                moveX: randomBetween(2.6, 4.2),
                moveY: randomBetween(2.2, 3.8),
                moveZ: randomBetween(1.6, 3.0),
                rotate: randomBetween(0.25, 0.55)
            };

            img.style.left = item.left + 'vw';
            img.style.top = item.top + 'vh';
            img.style.width = item.width + 'vw';
            img.style.maxWidth = 'none';
            img.style.height = 'auto';
            img.style.opacity = randomBetween(0.72, 0.96).toFixed(3);
            img.style.zIndex = String(3 + index);
            img.style.visibility = 'visible';

            img.addEventListener('error', () => {
                console.warn('Spider web PNG yüklenemedi:', src);
                if (img.parentNode) img.parentNode.removeChild(img);

        function seededShuffle(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;

            const pseudorandom = function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            };

            while (m) {
                i = Math.floor(pseudorandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

            const elapsedTime = totalElapsed % totalPlaylistDuration;

            const currentPlaylist = seededShuffle(baseSongList, cycleIndex + 42);

            let accumulatedTime = 0;
            for (let i = 0; i < currentPlaylist.length; i++) {
                if (elapsedTime < accumulatedTime + currentPlaylist[i].duration) {
                    return {
                        playlist: currentPlaylist,
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += currentPlaylist[i].duration;
            }
            return { playlist: currentPlaylist, songIndex: 0, seekTo: 0 };
        }

                });

                const chromeSide = new THREE.MeshPhysicalMaterial({

                    for (const cmd of path.commands) {
                        const x = (cmd.x || 0) * scale;
                        const y = -(cmd.y || 0) * scale;
                        if (cmd.type === 'M') shapePath.moveTo(x, y);
                        else if (cmd.type === 'L') shapePath.lineTo(x, y);
                        else if (cmd.type === 'C') shapePath.bezierCurveTo(
                            (cmd.x1 || 0) * scale, -(cmd.y1 || 0) * scale,
                            (cmd.x2 || 0) * scale, -(cmd.y2 || 0) * scale, x, y
                        );
                        else if (cmd.type === 'Q') shapePath.quadraticCurveTo(
                            (cmd.x1 || 0) * scale, -(cmd.y1 || 0) * scale, x, y
                        );
                    }
                    return shapePath.toShapes(false);
                };

                    const shapes = glyphShapes(brandFont, ch, size);
                    const geo = new THREE.ExtrudeGeometry(shapes, {
                        depth,

                            temp.computeBoundingBox();

                        totalWidth += w + tracking;
                    }
                    totalWidth -= tracking;

                    let cursor = -totalWidth / 2;
                    for (let i = 0; i < chars.length; i++) {
                        const ch = chars[i];

        function animateGlobe(currentTime) {
            requestAnimationFrame(animateGlobe);
            if (document.hidden) { lastTime = currentTime; return; }

            perfFrames++;
            if (currentTime - perfSampleStart >= 2000) {
                const fps = perfFrames * 1000 / (currentTime - perfSampleStart);
                if (fps < 48 && adaptivePixelRatio > 0.82) {
                    adaptivePixelRatio = Math.max(0.82, adaptivePixelRatio - 0.08);
                    renderer.setPixelRatio(adaptivePixelRatio);
                    resizeThreeJS();
                } else if (fps > 57 && adaptivePixelRatio < preferredPixelRatio) {
                    adaptivePixelRatio = Math.min(preferredPixelRatio, adaptivePixelRatio + 0.04);
                    renderer.setPixelRatio(adaptivePixelRatio);
                    resizeThreeJS();
                }
                perfFrames = 0;
                perfSampleStart = currentTime;
            }

            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            if (isNaN(deltaTime) || deltaTime > 0.1) return;

            const globeSpeed = isPlayingState ? 0.6 : 0.15;
            const ringSpeed = isPlayingState ? 0.75 : 0.22;
            globeMesh.rotation.y += globeSpeed * deltaTime;

            if (orbitTextGroup) {
                orbitTextGroup.rotation.y -= ringSpeed * deltaTime;
                if (orbitChromeMaterials.length >= 2) {
                    const face = orbitChromeMaterials[0];
                    const side = orbitChromeMaterials[1];
                    face.color.setRGB(0.82, 0.85, 0.88);
                    face.emissive.setRGB(0.085, 0.092, 0.10);
                    face.emissiveIntensity = 0.16;
                    side.color.setRGB(0.47, 0.51, 0.55);
                    side.emissive.setRGB(0.045, 0.050, 0.056);
                    side.emissiveIntensity = 0.11;
                }
            }

            animatePhotoWebs(deltaTime);
            renderer.render(scene, camera);
        }

        let lastWebMobileMode = window.innerWidth < 600;
        function handleResize() {
            resizeThreeJS();
            const mobileMode = window.innerWidth < 600;
            if (mobileMode !== lastWebMobileMode) {
                lastWebMobileMode = mobileMode;
                generatePhotoWebs();
            }
        }
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(handleResize, 120);
        });



        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (syncCheckInterval) {
                    clearInterval(syncCheckInterval);
                    syncCheckInterval = null;
                }
            } else if (userHasClicked) {
                syncToLiveStream();
                syncCheckInterval = setInterval(syncToLiveStream, 2000);
            }
        });

        resizeThreeJS();
        requestAnimationFrame(animateGlobe);
