    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ffffff;
            --energy: .12;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #020202;
            background: radial-gradient(circle at 50% 42%, #101010 0%, #040404 36%, #000 78%);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: manipulation;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 45;
            pointer-events: none;
            background: radial-gradient(circle at 50vw 50vh, rgba(255,255,255,.055), transparent 18%), radial-gradient(circle at 50% 45%, transparent 12%, #000 105%);
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 50;
            background-size: 100% 6px, 6px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.015) 50%, transparent 100%);
            z-index: 46;
            pointer-events: none;
            animation: scanlineAnim 12s linear infinite;
        }

        @keyframes scanlineAnim {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        #photo-webs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 6;
            pointer-events: none;
            overflow: visible;
            perspective: 1500px;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
        }

        .photo-web-3d {
            position: absolute;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
            will-change: transform;

            -webkit-mask-image: radial-gradient(ellipse 50% 50% at center,
                #000 8%, rgba(0,0,0,.8) 28%, rgba(0,0,0,.38) 50%,
                rgba(0,0,0,.09) 76%, transparent 100%);
            mask-image: radial-gradient(ellipse 50% 50% at center,
                #000 8%, rgba(0,0,0,.8) 28%, rgba(0,0,0,.38) 50%,
                rgba(0,0,0,.09) 76%, transparent 100%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            -webkit-mask-mode: alpha;
            mask-mode: alpha;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 95vw;
            height: 95vh;
            z-index: 4;
            pointer-events: none;
            contain: strict;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom)) 18px;
            gap: 12px;
            margin: 0 auto;
            max-width: 760px;
            perspective: 1200px;
            will-change: transform;
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 420px;
            height: clamp(180px, 32vh, 300px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
            filter: saturate(.9) contrast(1.08);
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 620px;
                height: clamp(260px, 38vh, 380px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
            filter: drop-shadow(0 0 26px rgba(255,255,255,.22)) drop-shadow(0 0 70px rgba(120,160,255,.10));
        }

        .status-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            padding: 0 4px;
        }

        .badge {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.16);
            padding: 7px 12px;
            border-radius: 40px;
            font-size: 9.5px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            white-space: nowrap;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 14px var(--accent-color);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.1; transform: scale(0.3); }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,.16);
            padding: 6px 12px;
            border-radius: 40px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
            pointer-events: auto;
        }

        .volume-control-box.disabled {
            pointer-events: none;
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        .volume-btn:active { transform: scale(0.8); }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        @media (max-width: 480px) {
            .status-bar { gap: 6px; }
            .badge { padding: 5px 9px; font-size: 8px; letter-spacing: 1px; }
            .volume-control-box { padding: 5px 9px; }
            .volume-slider { width: 38px; }
        }

        @media (max-width: 600px) {
            .now-playing-card {
                gap: 10px;
                align-items: center;
            }

            .track-info {
                flex: 1 1 58%;
                min-width: 0;
                max-width: 58%;
            }

            .next-track {
                flex: 1 1 38%;
                min-width: 0;
                max-width: 38%;
            }

            .track-title,
            #next-track-name {
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                overflow-wrap: anywhere;
                word-break: normal;
                line-height: 1.08;
            }

            .track-title {
                font-size: clamp(9px, 3.15vw, 13px);
                letter-spacing: 0.15px;
            }

            #next-track-name {
                display: block;
                font-size: clamp(7px, 2.45vw, 9px);
                text-align: right;
            }

            .track-label {
                font-size: 7px;
                letter-spacing: 1.25px;
            }
        }

        @media (max-width: 360px) {
            .now-playing-card { gap: 7px; }
            .track-title { font-size: clamp(8px, 3vw, 11px); }
            #next-track-name { font-size: clamp(6.5px, 2.35vw, 8px); }
        }

        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 140px;
            max-height: 38vh;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.16);
            transition: border-color 0.3s, box-shadow 0.3s;
            margin: 2px 0;
        }

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; pointer-events: auto;
        }

        .yt-shield-top-main { position: absolute; top: 0; left: 0; width: 100%; height: 82%; z-index: 15; background: transparent; }
        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 10, 0.96) 0%, rgba(0, 0, 0, 0.99) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: opacity 0.3s ease;
        }

        .start-btn {
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 11px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }


        .now-playing-card {
            width: 100%;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.16);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .next-track {
            font-size: 8.5px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .wave-bar {
            width: 2.5px;
            background: var(--accent-color);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--accent-color);
            animation: waveAnim 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 55%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        .badge, .volume-control-box, .now-playing-card, .video-container {
            isolation: isolate;
        }
        .badge::before, .volume-control-box::before, .now-playing-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(115deg, rgba(255,255,255,.09), transparent 28%, transparent 72%, rgba(255,255,255,.035));
            opacity: .55;
            z-index: -1;
        }
        .badge:hover, .volume-control-box:hover {
            transform: translateY(-1px);
            border-color: rgba(255,255,255,.58);
            box-shadow: 0 10px 34px rgba(0,0,0,.92), inset 0 0 16px rgba(255,255,255,.08);
        }
        .now-playing-card::after {
            content: "";
            position: absolute;
            left: 0; bottom: 0;
            width: var(--track-progress, 0%);
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,.25), #fff);
            box-shadow: 0 0 14px rgba(255,255,255,.65);
            transition: width .45s linear;
            pointer-events: none;
        }
        .track-time {
            margin-top: 2px;
            font-size: 7px;
            line-height: 1;
            letter-spacing: 1px;
            color: rgba(255,255,255,.42);
            font-variant-numeric: tabular-nums;
        }
        .video-container::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 14;
            pointer-events: none;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.035), inset 0 -40px 70px rgba(0,0,0,.18);
        }
        .start-btn:focus-visible, .volume-btn:focus-visible, .volume-slider:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }
        @media (prefers-reduced-motion: reduce) {
            .scanline-overlay, .live-dot, .start-btn::after, .wave-bar { animation: none !important; }
            .photo-web-3d { will-change: auto; }
        }

        .video-container, .now-playing-card, .badge, .volume-control-box { background: linear-gradient(135deg, rgba(20,20,20,.82), rgba(4,4,4,.72)); box-shadow: 0 22px 70px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.06); }
        .video-container { border-radius:24px; transform:translateZ(0); }
        .now-playing-card { border-radius:22px; padding:16px 18px; }
        .status-bar { position:relative; z-index:20; }
        .badge,.volume-control-box { min-height:32px; }
        .start-btn { padding:16px 44px; min-width:170px; border-radius:999px; letter-spacing:3.2px; background:linear-gradient(135deg,#fff 0%,#dcdcdc 48%,#fff 100%); border:1px solid rgba(255,255,255,.9); box-shadow:0 10px 34px rgba(0,0,0,.58),0 0 24px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 8px rgba(0,0,0,.14); }
        .start-btn::before { content:""; position:absolute; inset:4px; border-radius:inherit; border:1px solid rgba(0,0,0,.13); pointer-events:none; }
        .start-btn:hover { transform:translateY(-2px) scale(1.035); box-shadow:0 16px 42px rgba(0,0,0,.68),0 0 34px rgba(255,255,255,.24),inset 0 1px 0 #fff; }
        .start-btn:active { transform:translateY(0) scale(.985); }
        .ambient-glow { background:radial-gradient(circle at 50% 48%, rgba(255,255,255,.11), rgba(100,140,255,.035) 35%, transparent 68%); filter:blur(52px); opacity:.65; transform:translate(-50%,-50%) scale(calc(1 + var(--energy))); }
        body.playing .video-container { box-shadow:0 24px 80px rgba(0,0,0,.68),0 0 45px rgba(255,255,255,.055),inset 0 1px 0 rgba(255,255,255,.08); }
        body.playing .now-playing-card { box-shadow:0 18px 55px rgba(0,0,0,.7),0 0 26px rgba(255,255,255,.04); }
        html[data-quality="balanced"] .badge, html[data-quality="balanced"] .volume-control-box, html[data-quality="balanced"] .history-toggle, html[data-quality="balanced"] .now-playing-card { backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
        html[data-quality="balanced"] .ambient-glow { filter:blur(46px); }
        html[data-quality="balanced"] .scanline-overlay { animation-duration:18s; }
        html[data-quality="low"] .badge, html[data-quality="low"] .volume-control-box, html[data-quality="low"] .history-toggle, html[data-quality="low"] .now-playing-card { backdrop-filter:none; -webkit-backdrop-filter:none; }
        html[data-quality="low"] #start-overlay { backdrop-filter:none; -webkit-backdrop-filter:none; }
        html[data-quality="low"] .ambient-glow { filter:none; opacity:.42; }
        html[data-quality="low"] .scanline-overlay, html[data-quality="low"] .start-btn::after { animation:none; }
        html[data-quality="low"] .photo-web-3d { will-change:auto; }
        @media(max-width:700px){ .main-wrapper{padding-left:10px;padding-right:10px}.video-container{border-radius:18px}.now-playing-card{border-radius:16px} }



        /* --- SP1DER 2.1 additions --- */
        #listener-count {
            display: inline-block;
            min-width: 1.2ch;
            text-align: center;
            font-variant-numeric: tabular-nums;
            transform-origin: center;
        }

        #listener-count.listener-pop {
            animation: listenerPop .34s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes listenerPop {
            0% { transform: translateY(3px) scale(.82); opacity: .45; filter: blur(2px); }
            65% { transform: translateY(-1px) scale(1.10); opacity: 1; filter: blur(0); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .track-title.track-swap,
        #next-track-name.track-swap {
            animation: trackSwap .40s cubic-bezier(.16,.84,.28,1);
        }

        @keyframes trackSwap {
            0% { opacity: 0; transform: translateY(6px); filter: blur(5px); }
            58% { opacity: 1; transform: translateY(-1px); filter: blur(0); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .history-toggle {
            appearance: none;
            -webkit-appearance: none;
            min-height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,.16);
            background: linear-gradient(135deg, rgba(20,20,20,.82), rgba(4,4,4,.72));
            box-shadow: 0 22px 70px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: rgba(255,255,255,.82);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.35px;
            line-height: 1;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, color .18s ease;
            position: relative;
            isolation: isolate;
        }

        .history-toggle::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(115deg, rgba(255,255,255,.09), transparent 28%, transparent 72%, rgba(255,255,255,.035));
            opacity: .55;
            z-index: -1;
        }

        .history-clock {
            display: inline-block;
            font-size: 12px;
            line-height: 1;
            color: rgba(255,255,255,.72);
            transform: translateY(-.5px);
        }

        .history-toggle:hover,
        .history-toggle:focus-visible {
            color: #fff;

        const STREAM_START_TIME = 1700000000;

        function seededShuffle(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;

            const pseudorandom = function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            };

            while (m) {
                i = Math.floor(pseudorandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

        const totalPlaylistDuration = baseSongList.reduce((acc, song) => acc + song.duration, 0);
        const playlistCache = new Map();

        function getPlaylistForCycle(cycleIndex) {
            if (!playlistCache.has(cycleIndex)) {
                playlistCache.set(cycleIndex, seededShuffle(baseSongList, cycleIndex + 42));
                // History only needs nearby cycles; prevent an unbounded cache.
                while (playlistCache.size > 4) {
                    const oldestKey = playlistCache.keys().next().value;
                    playlistCache.delete(oldestKey);
                }
            }
            return playlistCache.get(cycleIndex);
        }

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const totalElapsed = Math.max(0, nowInSeconds - STREAM_START_TIME);

            const cycleIndex = Math.floor(totalElapsed / totalPlaylistDuration);
            const elapsedTime = totalElapsed % totalPlaylistDuration;

            const currentPlaylist = getPlaylistForCycle(cycleIndex);

            let accumulatedTime = 0;
            for (let i = 0; i < currentPlaylist.length; i++) {
                if (elapsedTime < accumulatedTime + currentPlaylist[i].duration) {
                    return {
                        playlist: currentPlaylist,
                        cycleIndex,
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += currentPlaylist[i].duration;
            }
            return { playlist: currentPlaylist, cycleIndex, songIndex: 0, seekTo: 0 };
        }

        const failedVideoIds = new Set();

        function resolvePlayableState(state) {
            let playlist = state.playlist;
            let cycleIndex = state.cycleIndex;
            let songIndex = state.songIndex;
            let seekTo = state.seekTo;

            for (let attempt = 0; attempt < baseSongList.length; attempt++) {
                const song = playlist[songIndex];
                if (song && !failedVideoIds.has(song.id)) {
                    return { playlist, cycleIndex, songIndex, seekTo, song };
                }

                songIndex += 1;
                seekTo = 0;
                if (songIndex >= playlist.length) {
                    cycleIndex += 1;
                    playlist = getPlaylistForCycle(cycleIndex);
                    songIndex = 0;
                }
            }

            return null;
        }

        function getNextPlayableSong(state) {
            let playlist = state.playlist;
            let cycleIndex = state.cycleIndex;
            let index = state.songIndex + 1;

            for (let attempt = 0; attempt < baseSongList.length; attempt++) {
                if (index >= playlist.length) {
                    cycleIndex += 1;
                    playlist = getPlaylistForCycle(cycleIndex);
                    index = 0;
                }
                const candidate = playlist[index];
                if (candidate && !failedVideoIds.has(candidate.id)) return candidate;
                index += 1;
            }
            return null;

            if (prefersReducedMotion.matches) return;
            el.classList.remove('track-swap');
            void el.offsetWidth;

        function getRecentlyPlayed(limit = 5) {
            const current = getCurrentStreamState();
            let playlist = current.playlist;
            let cycleIndex = current.cycleIndex;
            let index = current.songIndex - 1;
            let secondsAgo = current.seekTo;
            const result = [];

            while (result.length < limit && cycleIndex >= 0) {
                if (index < 0) {

                    if (cycleIndex < 0) break;
                    playlist = getPlaylistForCycle(cycleIndex);
                    index = playlist.length - 1;
                }
                const song = playlist[index];
                if (song) {
                    result.push({ song, secondsAgo });
                    secondsAgo += song.duration;
                }
                index -= 1;
            }
            return result;

                song.textContent = entry.song.title;

                const meta = document.createElement('div');
                meta.className = 'history-meta';
                meta.textContent = `${formatAgo(entry.secondsAgo)} · ${formatTime(entry.song.duration)}`;

                row.append(number, song, meta);
                historyList.appendChild(row);
            });
        }

        function openHistory() {
            renderHistory();
            historyModal.hidden = false;
            historyToggle.setAttribute('aria-expanded', 'true');
            historyClose.focus({ preventScroll: true });
        }

        function closeHistory() {
            if (historyModal.hidden) return;
            historyModal.hidden = true;
            historyToggle.setAttribute('aria-expanded', 'false');
            historyToggle.focus({ preventScroll: true });
        }

        historyToggle.addEventListener('click', openHistory);
        historyClose.addEventListener('click', closeHistory);
        historyBackdrop.addEventListener('click', closeHistory);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !historyModal.hidden) closeHistory();
        });

        function updateNowPlayingUI() {
            if (document.hidden) return;
            const state = resolvePlayableState(getCurrentStreamState());
            if (!state) return;
            const song = state.song;
            const progress = song.duration > 0 ? Math.min(100, (state.seekTo / song.duration) * 100) : 0;

            updateTrackLabels(state);
            nowPlayingCard.style.setProperty('--track-progress', `${progress.toFixed(2)}%`);
            trackTimeEl.textContent = `${formatTime(state.seekTo)} / ${formatTime(song.duration)}`;
        }
        let nowPlayingInterval = null;

        function startNowPlayingTicker() {
            if (nowPlayingInterval) clearInterval(nowPlayingInterval);
            updateNowPlayingUI();
            nowPlayingInterval = setInterval(updateNowPlayingUI, 1000);
        }

        startNowPlayingTicker();

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        const streamStatusEl = document.getElementById('stream-status');
        let streamStatusTimer = null;

        function showStreamStatus(message, timeout = 2200) {
            if (!streamStatusEl) return;
            clearTimeout(streamStatusTimer);
            streamStatusEl.textContent = message || '';
            streamStatusEl.classList.toggle('visible', Boolean(message));
            if (message && timeout > 0) {
                streamStatusTimer = setTimeout(() => {
                    streamStatusEl.classList.remove('visible');
                }, timeout);
            }
        }

        function onYouTubeIframeAPIReady() {
            const state = resolvePlayableState(getCurrentStreamState());
            if (!state) {
                showStreamStatus('STREAM TEMPORARILY UNAVAILABLE', 0);
                return;
            }
            const targetSong = state.song;
            currentLoadedVideoId = targetSong.id;

            player = new YT.Player('youtube-player', {
                videoId: targetSong.id,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'iv_load_policy': 3,
                    'fs': 0,
                    'start': Math.floor(state.seekTo),
                    'mute': 1
                },
                events: {
                    'onReady': () => {
                        isPlayerReady = true;
                        showStreamStatus('');
                        if (player && typeof player.playVideo === 'function') player.playVideo();
                    },
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerError(event) {
            if (currentLoadedVideoId) failedVideoIds.add(currentLoadedVideoId);
            actualPlayerStatePlaying = false;
            setListeningPresence(false);
            updateAudioVisualState();
            showStreamStatus(`TRACK UNAVAILABLE · SKIPPING (${event.data || 'ERR'})`, 2600);

            const replacement = resolvePlayableState(getCurrentStreamState());
            if (!replacement || !player) {
                showStreamStatus('STREAM TEMPORARILY UNAVAILABLE', 0);
                return;
            }

            currentLoadedVideoId = replacement.song.id;
            updateTrackLabels(replacement);
            player.loadVideoById({
                videoId: replacement.song.id,
                startSeconds: Math.floor(replacement.seekTo)
            });
            if (!userHasClicked && typeof player.mute === 'function') player.mute();
        }

        const waveBars = document.getElementById('wave-bars');
        const volumeRange = document.getElementById('volume-range');

        function updateAudioVisualState() {
            const vol = Number(volumeRange.value);

            if (!userHasClicked || vol === 0 || isMuted || !actualPlayerStatePlaying) {
                isPlayingState = false;
                waveBars.style.opacity = '0';
            } else {
                isPlayingState = true;
                waveBars.style.opacity = '1';
            }

            document.body.classList.toggle('playing', isPlayingState);
            document.documentElement.style.setProperty('--energy', isPlayingState ? '.28' : '.12');
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                actualPlayerStatePlaying = true;
                setListeningPresence(userHasClicked);
                showStreamStatus('');
            } else if (event.data === YT.PlayerState.ENDED) {
                actualPlayerStatePlaying = false;
                setListeningPresence(false);
                syncToLiveStream();
            } else if (event.data === YT.PlayerState.PAUSED ||
                       event.data === YT.PlayerState.CUED ||
                       event.data === YT.PlayerState.UNSTARTED) {
                actualPlayerStatePlaying = false;
                setListeningPresence(false);
            } else if (event.data === YT.PlayerState.BUFFERING) {
                actualPlayerStatePlaying = false;
                // Keep presence while a joined listener is briefly buffering.
            } else {
                actualPlayerStatePlaying = false;
            }
            updateAudioVisualState();
        }

        function syncToLiveStream() {
            if (!isPlayerReady || !player || !userHasClicked) return;

            const state = resolvePlayableState(getCurrentStreamState());
            if (!state) {
                showStreamStatus('STREAM TEMPORARILY UNAVAILABLE', 0);
                return;
            }
            const targetSong = state.song;

            updateTrackLabels(state);

            if (currentLoadedVideoId !== targetSong.id) {
                currentLoadedVideoId = targetSong.id;
                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();
                return;
            }

            if (typeof player.getCurrentTime === 'function') {
                const currentTime = player.getCurrentTime();
                const timeDiff = Math.abs(currentTime - state.seekTo);

                if (timeDiff > 2.0) {
                    player.seekTo(state.seekTo, true);
                    if (typeof player.getPlayerState === 'function' && player.getPlayerState() !== YT.PlayerState.PLAYING) {
                        player.playVideo();
                    }
                }
            }
        }

        function handleUserClick(e) {
            if (e && e.cancelable) e.preventDefault();
            if (userHasClicked) return;
            userHasClicked = true;

            const volumeBox = document.getElementById('volume-box');
            volumeBox.classList.remove('disabled');
            document.getElementById('mute-btn').removeAttribute('disabled');
            volumeRange.removeAttribute('disabled');

            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);

            showStreamStatus('CONNECTING TO LIVE...', 0);

            const startPlaying = () => {
                const state = resolvePlayableState(getCurrentStreamState());
                if (!state) {
                    showStreamStatus('STREAM TEMPORARILY UNAVAILABLE', 0);
                    return;
                }
                const targetSong = state.song;

                updateTrackLabels(state);

                if (typeof player.unMute === 'function') player.unMute();
                if (typeof player.setVolume === 'function') player.setVolume(Number(volumeRange.value));

                if (currentLoadedVideoId !== targetSong.id) {
                    currentLoadedVideoId = targetSong.id;
                    player.loadVideoById({
                        videoId: targetSong.id,
                        startSeconds: Math.floor(state.seekTo)
                    });
                } else {
                    player.seekTo(state.seekTo, true);
                }

                player.playVideo();
                updateAudioVisualState();

                if (syncCheckInterval) clearInterval(syncCheckInterval);
                syncCheckInterval = setInterval(syncToLiveStream, 2000);
            };

            if (isPlayerReady && player) {
                startPlaying();
            } else {
                const checkReady = setInterval(() => {
                    if (isPlayerReady && player) {
                        clearInterval(checkReady);
                        startPlaying();
                    }
                }, 50);
            }
        }

        const startOverlay = document.getElementById('start-overlay');

        startOverlay.addEventListener('click', handleUserClick);
        startOverlay.addEventListener('touchstart', handleUserClick, {passive: false});

        const muteBtn = document.getElementById('mute-btn');
        let isMuted = false;
        let lastVolume = 100;
        updateAudioVisualState();

        volumeRange.addEventListener('input', (e) => {
            const val = Number(e.target.value);

            if (player && typeof player.setVolume === 'function') {
                player.setVolume(val);
                if (val === 0) {
                    player.mute();
                    muteBtn.innerText = '🔇';
                    muteBtn.setAttribute('aria-label', 'Unmute');
                    isMuted = true;
                } else {
                    if (isMuted || (typeof player.isMuted === 'function' && player.isMuted())) {
                        player.unMute();
                        isMuted = false;
                    }
                    muteBtn.innerText = '🔊';
                    muteBtn.setAttribute('aria-label', 'Mute');
                    lastVolume = val;
                }
            }
            updateAudioVisualState();
        });

        muteBtn.addEventListener('click', () => {
            if (!player) return;
            if (isMuted) {
                player.unMute();
                muteBtn.innerText = '🔊';
                muteBtn.setAttribute('aria-label', 'Mute');
                let currentVol = Number(volumeRange.value);
                if (currentVol === 0) {
                    currentVol = lastVolume > 0 ? lastVolume : 100;
                    volumeRange.value = currentVol;
                }
                if (typeof player.setVolume === 'function') player.setVolume(currentVol);
                isMuted = false;
            } else {
                player.mute();
                muteBtn.innerText = '🔇';
                muteBtn.setAttribute('aria-label', 'Unmute');
                if (Number(volumeRange.value) > 0) {
                    lastVolume = Number(volumeRange.value);
                }
                volumeRange.value = 0;
                isMuted = true;
            }
            updateAudioVisualState();
        });

        const preferredPixelRatio = Math.min(window.devicePixelRatio || 1, pixelRatioCap);

        function resizeThreeJS() {
            const width = globeContainer.clientWidth;
            const height = globeContainer.clientHeight;
            if (width === 0 || height === 0) return;

            camera.aspect = width / height;

            if (window.innerWidth > 768) {
                camera.position.z = 5.2;
            } else if (window.innerHeight <= 650) {
                camera.position.z = 5.8;
            } else if (window.innerWidth <= 600) {
                camera.position.z = 5.5;

            camera.updateProjectionMatrix();
            renderer.setSize(width, height);

            'https://i.hizliresim.com/cd44fi2l.png',
            'https://i.hizliresim.com/texrnzfw.png'
        ];

        let orbitLogoRig = null;
        let orbitLogoFacing = null;
        let orbitLogoBody = null;
        let orbitLogoLight = null;
        let orbitLogoAngle = 0;
        const orbitLogoRadius = baseRadius + 0.82;

        function createChromeEnvironmentMap() {
            const makeFace = (direction = 1) => {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createLinearGradient(
                    direction > 0 ? 0 : 128,
                    0,
                    direction > 0 ? 128 : 0,
                    128
                );
                grad.addColorStop(0.00, '#050607');
                grad.addColorStop(0.18, '#252a2f');
                grad.addColorStop(0.36, '#f6fbff');
                grad.addColorStop(0.43, '#8d9aa4');
                grad.addColorStop(0.62, '#111417');
                grad.addColorStop(0.79, '#dce8ef');
                grad.addColorStop(1.00, '#020303');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 128, 128);

                const shine = ctx.createRadialGradient(40, 30, 2, 40, 30, 74);
                shine.addColorStop(0, 'rgba(255,255,255,.92)');
                shine.addColorStop(.18, 'rgba(180,210,228,.28)');
                shine.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = shine;
                ctx.fillRect(0, 0, 128, 128);
                return canvas;
            };

            const faces = [
                makeFace(1), makeFace(-1), makeFace(1),
                makeFace(-1), makeFace(1), makeFace(-1)
            ];
            const cube = new THREE.CubeTexture(faces);
            cube.needsUpdate = true;
            return cube;
        }

        const chromeEnvironmentMap = createChromeEnvironmentMap();

        function disposeOrbitLogo() {
            if (!orbitLogoRig) return;
            orbitLogoRig.traverse((child) => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                    mats.forEach((mat) => mat && mat.dispose && mat.dispose());
                }
            });
            scene.remove(orbitLogoRig);
            orbitLogoRig = null;
            orbitLogoFacing = null;
            orbitLogoBody = null;
            if (orbitLogoLight) {
                scene.remove(orbitLogoLight);
                orbitLogoLight = null;
            }
        }

        function buildOrbitLogo(texture) {
            disposeOrbitLogo();

            texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
            if ('encoding' in texture && THREE.sRGBEncoding) texture.encoding = THREE.sRGBEncoding;
            texture.needsUpdate = true;

            orbitLogoRig = new THREE.Group();
            orbitLogoRig.rotation.x = -0.055;
            orbitLogoRig.rotation.z = 0.018;
            scene.add(orbitLogoRig);

            orbitLogoFacing = new THREE.Group();
            orbitLogoFacing.position.set(0, 0.055, orbitLogoRadius);
            orbitLogoRig.add(orbitLogoFacing);

            orbitLogoBody = new THREE.Group();
            orbitLogoFacing.add(orbitLogoBody);

            const qualityScale = renderQuality === 'low' ? 0.92 : renderQuality === 'balanced' ? 0.97 : 1.0;
            const logoSize = 2.08 * qualityScale;
            const geometry = new THREE.PlaneGeometry(logoSize, logoSize, 1, 1);

            const frontMaterial = new THREE.MeshPhysicalMaterial({
                map: texture,
                color: 0xffffff,
                metalness: 0.86,
                roughness: 0.13,
                clearcoat: 1.0,
                clearcoatRoughness: 0.045,
                reflectivity: 1.0,
                envMap: chromeEnvironmentMap,
                envMapIntensity: 1.85,
                emissive: 0x20262b,
                emissiveMap: texture,
                emissiveIntensity: renderQuality === 'low' ? 0.22 : 0.34,
                alphaTest: 0.018,
                transparent: true,
                side: THREE.DoubleSide,
                depthTest: true,
                depthWrite: true
            });

            const sideMaterial = new THREE.MeshPhysicalMaterial({
                map: texture,
                color: 0x596068,
                metalness: 0.94,
                roughness: 0.23,
                clearcoat: 0.82,
                clearcoatRoughness: 0.11,
                reflectivity: 1.0,
                envMap: chromeEnvironmentMap,
                envMapIntensity: 1.25,
                alphaTest: 0.025,
                transparent: true,
                side: THREE.DoubleSide,
                depthTest: true,
                depthWrite: true
            });

            // Repeated alpha-cut silhouettes produce visible depth when the logo tilts.
            const depthLayers = renderQuality === 'low' ? 5 : renderQuality === 'balanced' ? 7 : 9;
            const totalDepth = renderQuality === 'low' ? 0.085 : 0.125;
            for (let i = depthLayers; i >= 1; i--) {
                const side = new THREE.Mesh(geometry, sideMaterial);
                side.position.z = -(i / depthLayers) * totalDepth;
                orbitLogoBody.add(side);
            }

            const front = new THREE.Mesh(geometry, frontMaterial);
            front.position.z = 0.006;
            front.renderOrder = 2;
            orbitLogoBody.add(front);

            const highlightMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                color: 0xeaf7ff,
                transparent: true,
                opacity: renderQuality === 'low' ? 0.055 : 0.105,
                alphaTest: 0.025,
                depthTest: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });
            const highlight = new THREE.Mesh(geometry, highlightMaterial);
            highlight.position.z = 0.012;
            highlight.scale.setScalar(1.008);
            highlight.renderOrder = 3;
            orbitLogoBody.add(highlight);

            // A subtle reflected light follows the emblem and catches the globe surface.
            orbitLogoLight = new THREE.PointLight(0xeaf6ff, renderQuality === 'low' ? 1.45 : 2.15, 4.6, 1.8);
            scene.add(orbitLogoLight);

            camera.layers.enable(1);
        }

        function loadOrbitLogoTexture(urls, index = 0) {
            if (index >= urls.length) {
                console.warn('SP1DER logo texture could not be loaded from any source.');
                return;
            }

            const logoLoader = new THREE.TextureLoader();
            logoLoader.setCrossOrigin('anonymous');
            logoLoader.load(
                urls[index],
                buildOrbitLogo,
                undefined,
                () => loadOrbitLogoTexture(urls, index + 1)
            );
        }

        loadOrbitLogoTexture(SP1DER_LOGO_TEXTURES);

        let lastTime = performance.now();
        let lastRenderTime = lastTime;
        const targetFPS = renderQuality === 'low' ? 30 : renderQuality === 'balanced' ? 45 : 60;
        const targetFrameInterval = 1000 / targetFPS;

        let perfSampleStart = performance.now();
        let perfFrames = 0;

        function animateGlobe(currentTime) {
            requestAnimationFrame(animateGlobe);
            if (document.hidden) {
                lastTime = currentTime;
                lastRenderTime = currentTime;
                return;
            }

            const frameElapsed = currentTime - lastRenderTime;
            if (frameElapsed < targetFrameInterval - 0.5) return;
            lastRenderTime = currentTime - (frameElapsed % targetFrameInterval);

            perfFrames++;
            if (currentTime - perfSampleStart >= 2000) {
                const fps = perfFrames * 1000 / (currentTime - perfSampleStart);
                if (fps < targetFPS * 0.80 && adaptivePixelRatio > minimumPixelRatio) {
                    adaptivePixelRatio = Math.max(minimumPixelRatio, adaptivePixelRatio - 0.08);
                    renderer.setPixelRatio(adaptivePixelRatio);
                    resizeThreeJS();
                } else if (fps > targetFPS * 0.94 && adaptivePixelRatio < preferredPixelRatio) {
                    adaptivePixelRatio = Math.min(preferredPixelRatio, adaptivePixelRatio + 0.03);
                    renderer.setPixelRatio(adaptivePixelRatio);
                    resizeThreeJS();
                }
                perfFrames = 0;
                perfSampleStart = currentTime;
            }

            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            if (isNaN(deltaTime) || deltaTime > 0.1) return;

            const globeSpeed = isPlayingState ? 0.6 : 0.15;
            const logoOrbitSpeed = isPlayingState ? 0.62 : 0.18;
            globeMesh.rotation.y += globeSpeed * deltaTime;

            if (orbitLogoRig && orbitLogoFacing && orbitLogoBody) {
                orbitLogoAngle -= logoOrbitSpeed * deltaTime;
                orbitLogoRig.rotation.y = orbitLogoAngle;

                // Keep the emblem readable while still exposing a little 3D thickness.
                orbitLogoFacing.lookAt(camera.position);
                orbitLogoBody.rotation.y = Math.sin(orbitLogoAngle * 1.35) * 0.16;
                orbitLogoBody.rotation.x = Math.cos(orbitLogoAngle * 0.82) * 0.055;
                orbitLogoBody.rotation.z = Math.sin(orbitLogoAngle * 0.58) * 0.035;

                if (orbitLogoLight) {
                    orbitLogoFacing.getWorldPosition(orbitLogoLight.position);
                    orbitLogoLight.position.multiplyScalar(1.025);
                }
            }

            animatePhotoWebs(deltaTime);
            renderer.render(scene, camera);
        }

        let lastWebMobileMode = window.innerWidth < 600;
        function handleResize() {
            resizeThreeJS();
            const mobileMode = window.innerWidth < 600;

            if (mobileMode !== lastWebMobileMode) {
                lastWebMobileMode = mobileMode;
                generatePhotoWebs();
            }
        }
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(handleResize, 120);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (nowPlayingInterval) {
                    clearInterval(nowPlayingInterval);
                    nowPlayingInterval = null;
                }
                if (syncCheckInterval) {
                    clearInterval(syncCheckInterval);
                    syncCheckInterval = null;
                }
            } else {
                startNowPlayingTicker();
                if (userHasClicked) {
                    syncToLiveStream();
                    if (syncCheckInterval) clearInterval(syncCheckInterval);
                    syncCheckInterval = setInterval(syncToLiveStream, 2000);
                }
            }
        });

        resizeThreeJS();
        requestAnimationFrame(animateGlobe);

       const firebaseConfig = {
  apiKey: "AIzaSyA4WSlpMCyEZPi-jFo-IpJQb55I_JG9iAc",
  authDomain: "sp1der-e75ff.firebaseapp.com",
  databaseURL: "https://sp1der-e75ff-default-rtdb.firebaseio.com",
  projectId: "sp1der-e75ff",
  storageBucket: "sp1der-e75ff.firebasestorage.app",
  messagingSenderId: "1024402090973",
  appId: "1:1024402090973:web:05e86d82e09cd6e1bce434",
  measurementId: "G-R0W695S9N6"
};

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const listenersRef = db.ref('online_listeners');
        const listenerCountEl = document.getElementById('listener-count');

        let myPresenceRef = null;
        let firebaseConnected = false;
        let presenceWanted = false;
        let presenceWriteInFlight = false;
        let renderedListenerCount = Number(listenerCountEl?.textContent || 0);
        let listenerAnimationFrame = 0;

        function removeListeningPresence() {
            presenceWanted = false;
            const ref = myPresenceRef;
            myPresenceRef = null;
            if (!ref) return;
            // Keep onDisconnect armed until the explicit remove finishes; this avoids stale
            // listener entries if the page closes before the write completes.
            ref.remove().catch(() => {});
        }

        function registerListeningPresence() {
            if (!presenceWanted || !firebaseConnected || myPresenceRef || presenceWriteInFlight) return;
            presenceWriteInFlight = true;
            const ref = listenersRef.push();
            ref.onDisconnect().remove();
            ref.set({ joinedAt: firebase.database.ServerValue.TIMESTAMP })
                .then(() => {
                    presenceWriteInFlight = false;
                    if (presenceWanted && firebaseConnected) {
                        myPresenceRef = ref;
                    } else {
                        ref.remove().catch(() => {});
                    }
                })
                .catch(() => {
                    presenceWriteInFlight = false;
                });
        }

        function setListeningPresence(active) {
            const shouldListen = Boolean(active && userHasClicked);
            if (!shouldListen) {
                removeListeningPresence();
                return;
            }
            presenceWanted = true;
            registerListeningPresence();
        }

        db.ref('.info/connected').on('value', (snap) => {
            firebaseConnected = snap.val() === true;
            if (firebaseConnected) {
                if (presenceWanted) registerListeningPresence();
            } else {
                myPresenceRef = null;
            }
        });

        function animateListenerCount(target) {
            if (!listenerCountEl) return;
            target = Math.max(0, Number(target) || 0);
            cancelAnimationFrame(listenerAnimationFrame);

            if (prefersReducedMotion.matches || target === renderedListenerCount) {
                renderedListenerCount = target;
                listenerCountEl.textContent = String(target);
                return;
            }

            const start = renderedListenerCount;
            const delta = target - start;
            const startTime = performance.now();
            const duration = 320;
            listenerCountEl.classList.remove('listener-pop');
            void listenerCountEl.offsetWidth;
            listenerCountEl.classList.add('listener-pop');

            const tick = (now) => {
                const t = Math.min(1, (now - startTime) / duration);
                const eased = 1 - Math.pow(1 - t, 3);
                listenerCountEl.textContent = String(Math.round(start + delta * eased));
                if (t < 1) {
                    listenerAnimationFrame = requestAnimationFrame(tick);
                } else {
                    renderedListenerCount = target;
                    listenerCountEl.textContent = String(target);
                }
            };
            listenerAnimationFrame = requestAnimationFrame(tick);
        }

        listenersRef.on('value', (snap) => {
            animateListenerCount(snap.numChildren());
        });

        window.addEventListener('pagehide', () => {
            removeListeningPresence();
        });
        window.addEventListener('pageshow', () => {
            if (userHasClicked && actualPlayerStatePlaying) setListeningPresence(true);
        });

        const wrapper = document.getElementById('main-wrapper');
        if (matchMedia('(pointer:fine)').matches && !prefersReducedMotion.matches) {
            let pointerFrame = 0;
            let pointerX = innerWidth / 2;
            let pointerY = innerHeight / 2;

            addEventListener('pointermove', (e) => {
                pointerX = e.clientX;
                pointerY = e.clientY;
                if (pointerFrame) return;

                pointerFrame = requestAnimationFrame(() => {
                    pointerFrame = 0;
                    const nx = pointerX / innerWidth - 0.5;
                    const ny = pointerY / innerHeight - 0.5;
                    wrapper.style.transform = `rotateY(${nx * 1.15}deg) rotateX(${-ny * 0.75}deg)`;
                });
            }, { passive: true });

            addEventListener('pointerleave', () => {
                if (pointerFrame) {
                    cancelAnimationFrame(pointerFrame);
                    pointerFrame = 0;
                }
                wrapper.style.transform = 'rotateY(0deg) rotateX(0deg)';
            });
        }

        // PWA/service-worker registration. It intentionally does not cache media streams;
        // only the app shell and static dependencies are cached.
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.warn('Service worker registration failed:', err);
                });
            });
        }

        window.addEventListener('offline', () => showStreamStatus('CONNECTION LOST · RECONNECTING', 0));
        window.addEventListener('online', () => {
            showStreamStatus('BACK ONLINE', 1400);
            if (userHasClicked) syncToLiveStream();
        });

    </script>
