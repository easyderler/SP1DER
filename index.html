<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SP1DER | 7/24 YÜZDE YÜZ MÜZİK</title>

    <link rel="preload" as="image" href="https://i.hizliresim.com/xllwx1bt.png" fetchpriority="high">
    <link rel="preload" as="image" href="https://i.hizliresim.com/tcbusgul.png" fetchpriority="high">
    <link rel="preload" as="image" href="https://i.hizliresim.com/bhocuany.png" fetchpriority="high">
    <link rel="preload" as="image" href="https://i.hizliresim.com/bkslqch8.png" fetchpriority="high">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Space+Grotesk:wght@500;700;900&family=Syne:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.55);
            --bg-glow: rgba(180, 220, 255, 0.1);
            --border-glow: rgba(255, 255, 255, 0.35);
            --bass-scale: 1;
            --bass-glow-scale: 1;
            --bass-opacity: 0.55;
            --glitch-x: 0px;
            --glitch-y: 0px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #020202;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: none;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, #000000 130%);
            z-index: 45;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 50;
            background-size: 100% 6px, 6px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.015) 50%, transparent 100%);
            z-index: 46;
            pointer-events: none;
            animation: scanlineAnim 12s linear infinite;
        }

        @keyframes scanlineAnim {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* Örümcek Ağları Kapsayıcısı */
        #photo-webs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 6;
            pointer-events: none;
            overflow: visible;
        }

        /* Ağların 3D dönüşü kapsayıcının perspektifini kullanır. */
        #photo-webs-container {
            perspective: 1500px;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
        }

        .photo-web-3d {
            position: absolute;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            object-fit: contain;
            object-position: center;
            transform-origin: center center;
            transform-style: preserve-3d;
            backface-visibility: visible;
            will-change: transform;
            perspective: 1500px;
            image-rendering: auto;
            opacity: 1;

            /* Maskenin yarıçapı kenara kadar uzanır; PNG'nin dört kenarında
               alpha sıfırdır. Köşeler daha erken kaybolur. */
            -webkit-mask-image: radial-gradient(ellipse 50% 50% at center,
                #000 8%, rgba(0,0,0,.8) 28%, rgba(0,0,0,.38) 50%,
                rgba(0,0,0,.09) 76%, transparent 100%);
            mask-image: radial-gradient(ellipse 50% 50% at center,
                #000 8%, rgba(0,0,0,.8) 28%, rgba(0,0,0,.38) 50%,
                rgba(0,0,0,.09) 76%, transparent 100%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            -webkit-mask-mode: alpha;
            mask-mode: alpha;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 95vw;
            height: 95vh;
            background: radial-gradient(circle, var(--glow-color) 0%, var(--bg-glow) 50%, rgba(0, 0, 0, 0) 80%);
            z-index: 4;
            pointer-events: none;
            will-change: transform, opacity;
            filter: blur(58px);
            contain: strict;
            transform: translate(-50%, -50%) scale(var(--bass-glow-scale));
            opacity: var(--bass-opacity);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)) 14px;
            gap: 12px;
            margin: 0 auto;
            box-sizing: border-box;
            will-change: transform, filter;
        }

        .wrapper-shake {
            animation: trapBassShake 0.055s cubic-bezier(.2,.8,.2,1) infinite alternate;
        }

        .wrapper-glitch {
            filter: drop-shadow(-6px 0 0px rgba(255, 0, 50, 0.9)) drop-shadow(6px 0 0px rgba(0, 240, 255, 0.9)) !important;
            transform: translate(var(--glitch-x), var(--glitch-y)) scale(1.035) !important;
        }

        @keyframes trapBassShake {
            0% { transform: scale(1) translate(0, 0); }
            35% { transform: scale(1.012) translate(-2.4px, 1.5px); }
            70% { transform: scale(0.994) translate(2.1px, -1.7px); }
            100% { transform: scale(1.006) translate(-1.2px, 2.2px); }
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 420px;
            height: clamp(180px, 32vh, 300px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 620px;
                height: clamp(260px, 38vh, 380px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
            filter: drop-shadow(0 0 40px var(--glow-color));
        }

        .status-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            padding: 0 4px;
        }

        .badge {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            padding: 7px 12px;
            border-radius: 40px;
            font-size: 9.5px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 14px var(--accent-color);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.1; transform: scale(0.3); }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
            pointer-events: auto;
        }

        .volume-control-box.disabled {
            pointer-events: none;
        }

        .badge-bass-pulse {
            transform: scale(1.04);
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 22px var(--glow-color) !important;
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        
        .volume-btn:active { transform: scale(0.8); }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        @media (max-width: 480px) {
            .status-bar { gap: 6px; }
            .badge { padding: 5px 9px; font-size: 8px; letter-spacing: 1px; }
            .volume-control-box { padding: 5px 9px; }
            .volume-slider { width: 38px; }
        }

        /* Mobilde uzun şarkı adlarını kesmek yerine okunabilir biçimde küçült/satırla */
        @media (max-width: 600px) {
            .now-playing-card {
                padding: 11px 12px;
                gap: 10px;
                align-items: center;
            }

            .track-info {
                flex: 1 1 58%;
                min-width: 0;
                max-width: 58%;
            }

            .next-track {
                flex: 1 1 38%;
                min-width: 0;
                max-width: 38%;
            }

            .track-title,
            #next-track-name {
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                overflow-wrap: anywhere;
                word-break: normal;
                line-height: 1.08;
            }

            .track-title {
                font-size: clamp(9px, 3.15vw, 13px);
                letter-spacing: 0.15px;
            }

            #next-track-name {
                display: block;
                font-size: clamp(7px, 2.45vw, 9px);
                text-align: right;
            }

            .track-label {
                font-size: 7px;
                letter-spacing: 1.25px;
            }
        }

        @media (max-width: 360px) {
            .now-playing-card { padding: 9px 10px; gap: 7px; }
            .track-title { font-size: clamp(8px, 3vw, 11px); }
            #next-track-name { font-size: clamp(6.5px, 2.35vw, 8px); }
        }

        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 140px;
            max-height: 38vh;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95);
            border: 1px solid var(--border-glow);
            transition: border-color 0.3s, box-shadow 0.3s;
            transform: scale(var(--bass-scale));
            background: #000;
            margin: 2px 0;
            will-change: transform;
        }

        .video-container.playing-border {
            border-color: var(--accent-color);
            box-shadow: 0 0 40px var(--glow-color), inset 0 0 25px var(--glow-color);
        }

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; pointer-events: auto;
        }

        .yt-shield-top-main { position: absolute; top: 0; left: 0; width: 100%; height: 82%; z-index: 15; background: transparent; }
        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 10, 0.96) 0%, rgba(0, 0, 0, 0.99) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .start-btn {
            background: var(--accent-color);
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 11px;
            padding: 16px 42px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 3.5px;
            box-shadow: 0 0 45px var(--accent-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .start-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 65px var(--accent-color);
        }

        .now-playing-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.95);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .next-track {
            font-size: 8.5px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .wave-bar {
            width: 2.5px;
            background: var(--accent-color);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--accent-color);
            animation: waveAnim 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 55%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="scanline-overlay"></div>

    <!-- Örümcek Ağları Kapsayıcısı -->
    <div id="photo-webs-container"></div>

    <div class="ambient-glow"></div>

    <div class="main-wrapper" id="main-wrapper">
        <div class="logo-container">
            <div id="globe-3d-container"></div>
        </div>

        <div class="status-bar">
            <div class="badge" id="badge-live">
                <span class="live-dot"></span>
                <span>CANLI</span>
            </div>
            <div class="badge" id="badge-listener">
                <span>🎧 DİNLEYİCİ: <strong id="listener-count" style="color: #ffffff; text-shadow:0 0 10px #fff;">1</strong></span>
            </div>
            <div class="volume-control-box disabled" id="volume-box">
                <button class="volume-btn" id="mute-btn" disabled>🔊</button>
                <input type="range" class="volume-slider" id="volume-range" min="0" max="100" value="100" disabled>
            </div>
        </div>

        <div class="video-container" id="video-box">
            <div class="yt-shield-top-main"></div>
            <div class="yt-shield-bottom-left"></div>
            <div class="yt-shield-bottom-edge"></div>

            <div id="start-overlay">
                <button class="start-btn" id="start-btn-el">CANLI YAYINA KATIL</button>
            </div>
            <div id="youtube-player"></div>
        </div>

        <div class="now-playing-card">
            <div class="track-info">
                <span class="track-label">
                    <span style="display:inline-block; width:6px; height:6px; background:var(--accent-color); border-radius:50%; box-shadow:0 0 10px var(--accent-color);"></span>
                    YAYINDA
                    <div class="wave-bars" id="wave-bars">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </span>
                <span class="track-title" id="current-track-name">Canlı Yayın Bekleniyor...</span>
            </div>
            <div class="next-track">
                <div class="track-label" style="justify-content: flex-end;">SIRADAKİ</div>
                <span id="next-track-name" style="font-weight:700;">---</span>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // GERÇEK PNG ÖRÜMCEK AĞLARI — CORS-SAFE 3D DOM
        // ================================================================
        // PNG'ler doğrudan <img> olarak kullanılır. Böylece HızlıResim'in
        // WebGL/CORS kısıtlamasına takılmadan şeffaf PNG'ler görüntülenir.
        // Three.js TextureLoader burada KULLANILMIYOR.

        const photoWebsContainer = document.getElementById('photo-webs-container');

        const realWebImages = [
            "https://i.hizliresim.com/av8t7brd.png",
            "https://i.hizliresim.com/xllwx1bt.png",
            "https://i.hizliresim.com/tcbusgul.png",
            "https://i.hizliresim.com/bhocuany.png",
            "https://i.hizliresim.com/bkslqch8.png"
        ];

        let photoWebElements = [];
        let webAnimationTime = 0;

        function randomBetween(a, b) {
            return a + Math.random() * (b - a);
        }

        // Ağların sabit merkezleri: sol üst, sağ üst, sol alt, sağ alt, orta.
        const webPositions = [
            [18, 18], [82, 18], [18, 82], [82, 82], [50, 50]
        ];

        function clearPhotoWebs() {
            photoWebElements.forEach(item => {
                if (item.el && item.el.parentNode) item.el.parentNode.removeChild(item.el);
            });
            photoWebElements = [];
        }

        function createWebElement(src, index) {
            const img = document.createElement('img');
            img.className = 'photo-web-3d';
            img.src = src;
            img.alt = '';
            img.decoding = 'async';
            img.loading = 'eager';
            img.fetchPriority = 'high';
            img.draggable = false;
            img.setAttribute('aria-hidden', 'true');

            const mobile = window.innerWidth < 600;

            const item = {
                el: img,
                left: webPositions[index][0],
                top: webPositions[index][1],
                depth: randomBetween(-80, 90),

                // Ağları önceki halden belirgin biçimde daha büyük yap.
                width: mobile ? randomBetween(60, 72) : randomBetween(52, 66),

                rotX: randomBetween(-4, 4),
                rotY: randomBetween(-7, 7),
                rotZ: randomBetween(-28, 28),
                scale: randomBetween(0.92, 1.08),

                phase: Math.random() * Math.PI * 2,
                speed: randomBetween(0.9, 1.35),
                moveX: randomBetween(2.6, 4.2),
                moveY: randomBetween(2.2, 3.8),
                moveZ: randomBetween(1.6, 3.0),
                rotate: randomBetween(0.25, 0.55)
            };

            // left/top ağın merkezidir.
            img.style.left = item.left + 'vw';
            img.style.top = item.top + 'vh';
            img.style.width = item.width + 'vw';
            img.style.maxWidth = 'none';
            img.style.height = 'auto';
            img.style.opacity = randomBetween(0.72, 0.96).toFixed(3);
            img.style.zIndex = String(3 + index);
            img.style.visibility = 'visible';

            img.addEventListener('error', () => {

                /* Gerçek CSS 3D hareket: X/Y kayma + Z derinlik + üç eksende dönüş.
                   Farklı frekanslar ağların birbirinden bağımsız, doğal hareket etmesini sağlar. */
                const dx = (Math.cos(t) * 0.72 + Math.sin(t * 1.71) * 0.28) * item.moveX;
                const dy = (Math.sin(t * 1.08) * 0.72 + Math.cos(t * 1.63) * 0.28) * item.moveY;
                const dz = (Math.sin(t * 0.72) * 0.78 + Math.cos(t * 1.37) * 0.22) * item.moveZ;

                const rx = item.rotX + Math.sin(t * 0.55) * 4.2;
                const ry = item.rotY + Math.cos(t * 0.48) * 5.5;
                const rz = (Math.sin(t * 0.62) * 0.78 + Math.cos(t * 1.41) * 0.22) * item.rotate * 8;

                item.el.style.transform =
                    `translate3d(calc(-50% + ${dx.toFixed(2)}px), calc(-50% + ${dy.toFixed(2)}px), ${item.depth + dz}px) ` +
                    `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) rotateZ(${(item.rotZ + rz).toFixed(2)}deg) scale(${item.scale.toFixed(4)})`;

        function seededShuffle(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;

            const pseudorandom = function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            };

            while (m) {
                i = Math.floor(pseudorandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

            const nowInSeconds = Math.floor(Date.now() / 1000);

            const cycleIndex = Math.floor(totalElapsed / totalPlaylistDuration);
            const elapsedTime = totalElapsed % totalPlaylistDuration;

            const currentPlaylist = seededShuffle(baseSongList, cycleIndex + 42);

            let accumulatedTime = 0;
            for (let i = 0; i < currentPlaylist.length; i++) {
                if (elapsedTime < accumulatedTime + currentPlaylist[i].duration) {
                    return {
                        playlist: currentPlaylist,
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += currentPlaylist[i].duration;
            }
            return { playlist: currentPlaylist, songIndex: 0, seekTo: 0 };
        }

        let ringMesh = null;

        function createOrbitRingText() {
            // Gerçek 3D + gerçekten kavisli yazı:
            // Her harf ayrı TextGeometry olarak üretilir ve silindirik bir yay üzerinde
            // konumlandırılır. Böylece metin düz bir tabela gibi değil, dünyanın formunu sarar.
            if (!THREE.FontLoader || !THREE.TextGeometry) {
                console.warn('3D text modules yüklenemedi.');
                return;
            }

            if (orbitTextGroup) scene.remove(orbitTextGroup);
            orbitTextGroup = new THREE.Group();
            orbitTextGroup.rotation.x = -0.10;
            orbitTextGroup.rotation.z = 0.03;
            scene.add(orbitTextGroup);

            const fontLoader = new THREE.FontLoader();
            fontLoader.load(
                'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/droid/droid_sans_bold.typeface.json',
                (font) => {
                    // Krom yüzey: açık gümüş taban + koyu yan yüzey. Işık hareket ettikçe
                    // clearcoat/specular yansımaları yüzeyde canlı bir chrome geçişi oluşturur.
                    const chromeFace = new THREE.MeshPhysicalMaterial({
                        color: 0xf4f7f8,
                        metalness: 0.72,
                        roughness: 0.20,
                        clearcoat: 1.0,
                        clearcoatRoughness: 0.055,
                        reflectivity: 1.0,
                        emissive: 0x252b30,
                        emissiveIntensity: 0.10,
                        side: THREE.DoubleSide,
                        depthTest: true,
                        depthWrite: true
                    });

                    const chromeSide = new THREE.MeshPhysicalMaterial({
                        color: 0xaab2b8,
                        metalness: 0.76,
                        roughness: 0.24,
                        clearcoat: 0.92,
                        clearcoatRoughness: 0.09,
                        reflectivity: 1.0,
                        emissive: 0x171b1e,
                        emissiveIntensity: 0.07,
                        side: THREE.DoubleSide,
                        depthTest: true,
                        depthWrite: true
                    });
                    orbitChromeMaterials = [chromeFace, chromeSide];

                    // Harfleri tek tek bir yay üzerine dizer. radius küçüldükçe kavis artar.
                    const makeCurvedText = (text, size, depth, bevel, y, radius, totalArc, tracking, xScale=0.84) => {
                        const holder = new THREE.Group();
                        holder.position.y = y;
                        orbitTextGroup.add(holder);

                        const chars = [...text];
                        const widths = [];
                        let totalWidth = 0;

                        for (const ch of chars) {
                            if (ch === ' ') {
                                const w = size * 0.42;
                                widths.push(w);
                                totalWidth += w + tracking;
                                continue;
                            }
                            const temp = new THREE.TextGeometry(ch, {
                                font, size, height: depth,
                                curveSegments: 6,
                                bevelEnabled: true,
                                bevelThickness: bevel,
                                bevelSize: bevel * 0.78,
                                bevelOffset: 0,
                                bevelSegments: 3
                            });
                            temp.computeBoundingBox();
                            const b = temp.boundingBox;
                            const w = (b.max.x - b.min.x) * xScale;
                            widths.push(w);
                            totalWidth += w + tracking;
                            temp.dispose();
                        }
                        totalWidth -= tracking;

                        let cursor = -totalWidth / 2;
                        for (let i = 0; i < chars.length; i++) {
                            const ch = chars[i];
                            const w = widths[i];
                            const center = cursor + w / 2;
                            cursor += w + tracking;
                            if (ch === ' ') continue;

                            // Metnin toplam genişliğini belirtilen yay açısına map et.
                            const normalized = totalWidth > 0 ? center / totalWidth : 0;
                            const theta = normalized * totalArc;

                            const geo = new THREE.TextGeometry(ch, {
                                font, size, height: depth,
                                curveSegments: 6,
                                bevelEnabled: true,
                                bevelThickness: bevel,
                                bevelSize: bevel * 0.78,
                                bevelOffset: 0,
                                bevelSegments: 3
                            });
                            geo.computeBoundingBox();
                            const box = geo.boundingBox;
                            const gw = box.max.x - box.min.x;
                            const gh = box.max.y - box.min.y;
                            geo.translate(-gw/2 - box.min.x, -gh/2 - box.min.y, -depth/2);
                            geo.scale(xScale, 1, 1);

                            // Hafif sağa yatık/condensed form daha trap-logo hissi verir.
                            const pos = geo.attributes.position;
                            for (let p = 0; p < pos.count; p++) {
                                pos.setX(p, pos.getX(p) + pos.getY(p) * 0.14);
                            }
                            pos.needsUpdate = true;
                            geo.computeVertexNormals();

                            const mesh = new THREE.Mesh(geo, [chromeFace, chromeSide]);
                            // Dünya yüzeyini saran gerçek kavis.
                            mesh.position.x = Math.sin(theta) * radius;
                            mesh.position.z = Math.cos(theta) * radius;
                            // Harfin önü her noktada yörüngenin dışına bakar.
                            mesh.rotation.y = theta;
                            mesh.renderOrder = 1;
                            mesh.layers.set(1); // krom ışıkları yalnızca yazıyı etkiler
                            holder.add(mesh);
                        }
                        return holder;
                    };

                    // SP1DER belirgin şekilde kavisli; alt slogan aynı yayı takip eder ama küçük kalır.
                    makeCurvedText('SP1DER', 0.59, 0.135, 0.032, 0.12, baseRadius + 0.20, 1.30, 0.018, 0.72);
                    makeCurvedText('7/24 YÜZDE YÜZ MÜZİK', 0.150, 0.068, 0.015, -0.315, baseRadius + 0.20, 1.48, 0.007, 0.78);

                    // Ekstra hareketli sahne ışığı kullanılmıyor. Böylece dünya üzerinde dolaşan
                    // parlak yuvarlak/specular lekeler oluşmaz. Kromun canlılığı materyalin kendi
                    // metalik ton geçişiyle animasyon sırasında verilir.
                    camera.layers.enable(1);
                },
                undefined,
                (err) => console.warn('3D SP1DER fontu yüklenemedi:', err)
            );
        }

        document.fonts.ready.then(() => { createOrbitRingText(); });

        let bassAngle = 0;
        const badgeLiveEl = document.getElementById('badge-live');
        const badgeListenerEl = document.getElementById('badge-listener');
        const volumeBoxEl = document.getElementById('volume-box');

        let lastTime = performance.now();
        const rootStyle = document.documentElement.style;
        const idleGlobeScale = new THREE.Vector3(1, 1, 1);
        let lastGlitchUpdate = 0;
        // FPS dengeleyici: efekt kalitesini korurken zayıf cihazlarda render yükünü otomatik düşürür.
        let perfSampleStart = performance.now();
        let perfFrames = 0;
        let lastBarUpdate = 0;
        let smoothedBass = 0;
        let bassKick = 0;
        const bassEase = 18.0;

        // TEK BASS KAYNAĞI:
        // Dünya, 5'ler, noktalar ve örümcek ağları aynı bassPower değerini
        // kullanır. Böylece efektler birebir aynı anda ve aynı şiddette patlar.
function animateGlobe(currentTime) {
            requestAnimationFrame(animateGlobe);
            if (document.hidden) { lastTime = currentTime; return; }

            perfFrames++;
            if (currentTime - perfSampleStart >= 2000) {
                const fps = perfFrames * 1000 / (currentTime - perfSampleStart);
                // Uzun süre 48 FPS altına düşerse WebGL çözünürlüğünü biraz azalt.
                if (fps < 48 && adaptivePixelRatio > 0.82) {
                    adaptivePixelRatio = Math.max(0.82, adaptivePixelRatio - 0.08);
                    renderer.setPixelRatio(adaptivePixelRatio);
                    resizeThreeJS();
                } else if (fps > 57 && adaptivePixelRatio < preferredPixelRatio) {
                    adaptivePixelRatio = Math.min(preferredPixelRatio, adaptivePixelRatio + 0.04);
                    renderer.setPixelRatio(adaptivePixelRatio);
                    resizeThreeJS();
                }
                perfFrames = 0;
                perfSampleStart = currentTime;
            }

            const deltaTime = (currentTime - lastTime) / 1000; 
            lastTime = currentTime;

            if (isNaN(deltaTime) || deltaTime > 0.1) return;

            const globeSpeed = isPlayingState ? 0.6 : 0.15;
            const ringSpeed = isPlayingState ? 0.75 : 0.22;

            globeMesh.rotation.y += globeSpeed * deltaTime;
            if (orbitTextGroup) {
                orbitTextGroup.rotation.y -= ringSpeed * deltaTime;

                // SABİT TEK IŞIK: burada konum/intensity animasyonu YOK.
                // Yazı dünya etrafında döndüğü için sabit ışığa yaklaşan yüzleri parlar,
                // uzaklaşan yüzleri koyulaşır. Böylece yansıma fiziksel olarak konuma bağlıdır.
                if (orbitChromeMaterials.length >= 2) {
                    const face = orbitChromeMaterials[0];
                    const side = orbitChromeMaterials[1];
                    // Kromun karanlıkta tamamen siyaha düşmesini engelleyen düşük taban ışığı.
                    face.color.setRGB(0.82, 0.85, 0.88);
                    face.emissive.setRGB(0.085, 0.092, 0.10);
                    face.emissiveIntensity = 0.16;
                    side.color.setRGB(0.47, 0.51, 0.55);
                    side.emissive.setRGB(0.045, 0.050, 0.056);
                    side.emissiveIntensity = 0.11;
                }
            }
            ringBarsGroup.rotation.z += (isPlayingState ? 0.4 : 0.05) * deltaTime;

            if (isPlayingState) {
                bassAngle += 7.0 * deltaTime;
                
                const rawBass = Math.max(0, Math.pow(Math.sin(bassAngle), 10));
                // Sert aç/kapa yerine hızlı attack + yumuşak decay: kick daha tok, görüntü daha akıcı.
                const follow = 1 - Math.exp(-bassEase * deltaTime);
                smoothedBass += (rawBass - smoothedBass) * follow;
                if (rawBass > 0.72 && bassKick < 0.28) bassKick = 1;
                bassKick = Math.max(0, bassKick - deltaTime * 5.4);
                const bassPower = Math.min(1, smoothedBass * 0.88 + bassKick * 0.72);
                // Daha sert kick: dünya vuruş anında belirgin biçimde nefes alır.
                const bassScale = 1 + bassPower * 0.095 + bassKick * 0.035; 
                globeMesh.scale.set(bassScale, bassScale, bassScale);

                dirLight.intensity = 0.92 + bassPower * 0.62 + bassKick * 0.28;

                rootStyle.setProperty('--bass-scale', (1 + bassPower * 0.034 + bassKick * 0.014).toFixed(3));
                rootStyle.setProperty('--bass-glow-scale', (1 + bassPower * 0.42 + bassKick * 0.20).toFixed(3));
                rootStyle.setProperty('--bass-opacity', (0.40 + bassPower * 0.46 + bassKick * 0.12).toFixed(2));

                if (bassPower > 0.46) {
                    badgeLiveEl.classList.add('badge-bass-pulse');
                    badgeListenerEl.classList.add('badge-bass-pulse');
                    volumeBoxEl.classList.add('badge-bass-pulse');
                } else {
                    badgeLiveEl.classList.remove('badge-bass-pulse');
                    badgeListenerEl.classList.remove('badge-bass-pulse');
                    volumeBoxEl.classList.remove('badge-bass-pulse');
                }

                if (bassPower > 0.68 && bassKick > 0.10) {
                    // Glitch konumu her frame değil, yaklaşık 12.5 kez/sn güncellenir.
                    if (currentTime - lastGlitchUpdate > 130) {
                        lastGlitchUpdate = currentTime;
                        rootStyle.setProperty('--glitch-x', ((Math.random() - 0.5) * 16).toFixed(1) + 'px');
                        rootStyle.setProperty('--glitch-y', ((Math.random() - 0.5) * 10).toFixed(1) + 'px');
                    }
                    mainWrapper.classList.add('wrapper-glitch');
                } else {
                    mainWrapper.classList.remove('wrapper-glitch');
                }

                // Spektrum halkası 30 FPS güncellenir; dünya/yazı 60 FPS akmaya devam eder.
                if (currentTime - lastBarUpdate >= 33) {
                    lastBarUpdate = currentTime;
                    const currentRadius = (baseRadius * bassScale) + 0.01;
                    for (let idx = 0; idx < ringBarsCount; idx++) {
                        const bar = ringBarMeshes[idx];
                        const rnd = Math.sin(bassAngle * 2.7 + idx * 0.82) * 0.5 + 0.5;
                        const scaleY = 0.22 + rnd * 2.35 * (bassPower + 0.28) + bassKick * (0.58 + rnd * 0.82);
                        bar.position.set(ringBarCos[idx] * currentRadius, ringBarSin[idx] * currentRadius, 0);
                        bar.scale.y = scaleY;
                        bar.material.opacity = Math.min(1, 0.40 + rnd * 0.34 + bassPower * 0.34 + bassKick * 0.22);
                    }
                }

            } else {
                // Yayın başlamadıysa, durmuşsa veya ses kapalıysa BASS = 0.
                smoothedBass *= Math.max(0, 1 - deltaTime * 8);
                bassKick = 0;
                // Böylece hiçbir arka plan öğesi patlamaz.
globeMesh.scale.lerp(idleGlobeScale, 10 * deltaTime);
                dirLight.intensity = 0.48;

                rootStyle.setProperty('--bass-scale', '1');
                rootStyle.setProperty('--bass-glow-scale', '1');
                rootStyle.setProperty('--bass-opacity', '0.4');

                mainWrapper.classList.remove('wrapper-glitch');
                badgeLiveEl.classList.remove('badge-bass-pulse');
                badgeListenerEl.classList.remove('badge-bass-pulse');
                volumeBoxEl.classList.remove('badge-bass-pulse');

                for (let idx = 0; idx < ringBarsCount; idx++) {
                    const bar = ringBarMeshes[idx];
                    const currentRadius = baseRadius + 0.01;
                    bar.position.set(ringBarCos[idx] * currentRadius, ringBarSin[idx] * currentRadius, 0);

                    bar.scale.set(1, 0.25, 1);
                    bar.material.opacity = 0.35;
                }
            }

            animatePhotoWebs(deltaTime);
            renderer.render(scene, camera);
        }

        let lastWebMobileMode = window.innerWidth < 600;
        function handleResize() {
            resizeThreeJS();
            const mobileMode = window.innerWidth < 600;
            // Ağları yalnızca mobil/desktop breakpoint değişince yeniden üret.
            if (mobileMode !== lastWebMobileMode) {
                lastWebMobileMode = mobileMode;
                generatePhotoWebs();
            }
        }
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(handleResize, 120);
        });

        // Başlat
        resizeThreeJS();
        requestAnimationFrame(animateGlobe);

  appId: "1:1024402090973:web:05e86d82e09cd6e1bce434",
  measurementId: "G-R0W695S9N6"
};

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const listenersRef = db.ref('online_listeners');
        const listenerCountEl = document.getElementById('listener-count');

        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                const myPresenceRef = listenersRef.push();
                myPresenceRef.onDisconnect().remove();
                myPresenceRef.set(true);
            }
        });

        listenersRef.on('value', (snap) => {
            const count = snap.numChildren();
            if (listenerCountEl) {
                listenerCountEl.innerText = count > 0 ? count : 1;
            }
        });
    </script>
