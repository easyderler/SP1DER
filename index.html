<html lang="tr">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.55);
            --bg-glow: rgba(180, 220, 255, 0.1);
            --border-glow: rgba(255, 255, 255, 0.35);
            --bass-scale: 1;
            --bass-glow-scale: 1;
            --bass-opacity: 0.55;
            --glitch-x: 0px;
            --glitch-y: 0px;
            --web-bass: 0;
            --web-bass-opacity: 1;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #020202;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: none;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, #000000 130%);
            z-index: 45;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 50;
            background-size: 100% 6px, 6px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.015) 50%, transparent 100%);
            z-index: 46;
            pointer-events: none;
            animation: scanlineAnim 12s linear infinite;
        }

        @keyframes scanlineAnim {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* Örümcek Ağları Kapsayıcısı */
        #photo-webs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 6;
            pointer-events: none;
            overflow: hidden;
        }

        /* Örümcek ağları artık CSS <img> değil: Three.js ile gerçek PNG fotoğrafları
           3D uzayda plane texture olarak gösteriliyor. Böylece dünya ile aynı WebGL
           render mantığını kullanıyorlar. */
        #photo-webs-container {
            background: transparent;
        }

        .photo-web-3d {
            position:absolute;
            display:block;
            pointer-events:none;
            user-select:none;
            -webkit-user-drag:none;
            object-fit:contain;
            object-position:center;
            transform-origin:center center;
            transform-style:preserve-3d;
            backface-visibility:visible;
            will-change:transform;
            filter:none;
            perspective:1200px;
            /* PNG'nin kare kenarını yumuşat: kenarlarda alpha'ya doğru fade. */
            -webkit-mask-image: radial-gradient(ellipse 72% 72% at 50% 50%, #000 52%, rgba(0,0,0,.92) 66%, rgba(0,0,0,.42) 82%, transparent 100%);
            mask-image: radial-gradient(ellipse 72% 72% at 50% 50%, #000 52%, rgba(0,0,0,.92) 66%, rgba(0,0,0,.42) 82%, transparent 100%);
            -webkit-mask-repeat:no-repeat;
            mask-repeat:no-repeat;
            -webkit-mask-size:100% 100%;
            mask-size:100% 100%;
            image-rendering:auto;
            opacity:1;
        }

        .photo-web-3d.bass-hit {
            filter: brightness(1.45) drop-shadow(0 0 18px rgba(255,255,255,.9)) !important;
        }

        #photo-webs-container canvas {
            display: block !important;
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            outline: none;
        }

        /* Arkaplan "5" Yazı Kapsayıcısı */
        #gothic-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .random-gothic-text {
            position: absolute;
            color: rgba(255, 255, 255, 0.04);
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.06);
            will-change: transform, opacity;
            text-transform: uppercase;
            letter-spacing: 2px;
            user-select: none;
            opacity: 0;
            animation: softFadeText 8s ease-in-out infinite alternate;
        }

        @keyframes softFadeText {
            0% { opacity: 0; transform: scale(0.9) rotate(var(--rot)); }
            50% { opacity: var(--max-op); transform: scale(1.05) rotate(var(--rot)); }
            100% { opacity: 0; transform: scale(0.95) rotate(var(--rot)); }
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 95vw;
            height: 95vh;
            background: radial-gradient(circle, var(--glow-color) 0%, var(--bg-glow) 50%, rgba(0, 0, 0, 0) 80%);
            z-index: 4;
            pointer-events: none;
            will-change: transform, opacity;
            filter: blur(70px);
            transform: translate(-50%, -50%) scale(var(--bass-glow-scale));
            opacity: var(--bass-opacity);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)) 14px;
            gap: 12px;
            margin: 0 auto;
            box-sizing: border-box;
            will-change: transform, filter;
        }

        .wrapper-shake {
            animation: trapBassShake 0.07s ease-in-out infinite alternate;
        }

        .wrapper-glitch {
            filter: drop-shadow(-6px 0 0px rgba(255, 0, 50, 0.9)) drop-shadow(6px 0 0px rgba(0, 240, 255, 0.9)) !important;
            transform: translate(var(--glitch-x), var(--glitch-y)) scale(1.02) !important;
        }

        @keyframes trapBassShake {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.008) translate(-1.5px, 1.5px); }
            100% { transform: scale(0.992) translate(1.5px, -1.5px); }
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 420px;
            height: clamp(180px, 32vh, 300px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 620px;
                height: clamp(260px, 38vh, 380px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
            filter: drop-shadow(0 0 40px var(--glow-color));
        }

        .status-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            padding: 0 4px;
        }

        .badge {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            padding: 7px 12px;
            border-radius: 40px;
            font-size: 9.5px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 14px var(--accent-color);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.1; transform: scale(0.3); }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            pointer-events: auto;
        }

        .volume-control-box.disabled {
            pointer-events: none;
        }

        .badge-bass-pulse {
            transform: scale(1.04);
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 22px var(--glow-color) !important;
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        
        .volume-btn:active { transform: scale(0.8); }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        @media (max-width: 480px) {
            .status-bar { gap: 6px; }
            .badge { padding: 5px 9px; font-size: 8px; letter-spacing: 1px; }
            .volume-control-box { padding: 5px 9px; }
            .volume-slider { width: 38px; }
        }

        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 140px;
            max-height: 38vh;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95);
            border: 1px solid var(--border-glow);
            transition: border-color 0.3s, box-shadow 0.3s;
            transform: scale(var(--bass-scale));
            background: #000;
            margin: 2px 0;
            will-change: transform;
        }

        .video-container.playing-border {
            border-color: var(--accent-color);
            box-shadow: 0 0 40px var(--glow-color), inset 0 0 25px var(--glow-color);
        }

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; pointer-events: auto;
        }

        .yt-shield-top-main { position: absolute; top: 0; left: 0; width: 100%; height: 82%; z-index: 15; background: transparent; }
        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 10, 0.96) 0%, rgba(0, 0, 0, 0.99) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .start-btn {
            background: var(--accent-color);
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 11px;
            padding: 16px 42px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 3.5px;
            box-shadow: 0 0 45px var(--accent-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .start-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 65px var(--accent-color);
        }

        .now-playing-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.95);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .next-track {
            font-size: 8.5px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .wave-bar {
            width: 2.5px;
            background: var(--accent-color);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--accent-color);
            animation: waveAnim 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 55%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

</head>
<body>

    <div class="scanline-overlay"></div>

    <!-- Örümcek Ağları Kapsayıcısı -->
    <div id="photo-webs-container"></div>

    <!-- Arkaplan Kapsayıcısı -->
    <div id="gothic-bg-container"></div>

    <canvas id="bg-canvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="main-wrapper" id="main-wrapper">
        <div class="logo-container">
            <div id="globe-3d-container"></div>
        </div>

        <div class="status-bar">
            <div class="badge" id="badge-live">
                <span class="live-dot"></span>

            </div>

            </div>
            <div class="volume-control-box disabled" id="volume-box">

                <input type="range" class="volume-slider" id="volume-range" min="0" max="100" value="100" disabled>
            </div>
        </div>

        <div class="video-container" id="video-box">
            <div class="yt-shield-top-main"></div>

            <div id="start-overlay">
                <button class="start-btn" id="start-btn-el">CANLI YAYINA KATIL</button>
            </div>

        </div>

        <div class="now-playing-card">
            <div class="track-info">
                <span class="track-label">
                    <span style="display:inline-block; width:6px; height:6px; background:var(--accent-color); border-radius:50%; box-shadow:0 0 10px var(--accent-color);"></span>
                    YAYINDA
                    <div class="wave-bars" id="wave-bars">
                        <div class="wave-bar"></div>

                        <div class="wave-bar"></div>

                    </div>
                </span>

                <div class="track-label" style="justify-content: flex-end;">SIRADAKİ</div>
                <span id="next-track-name" style="font-weight:700;">---</span>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // GERÇEK PNG ÖRÜMCEK AĞLARI — CORS-SAFE 3D DOM
        // ================================================================
        // PNG'ler doğrudan <img> olarak kullanılır. Böylece HızlıResim'in
        // WebGL/CORS kısıtlamasına takılmadan şeffaf PNG'ler görüntülenir.
        // Three.js TextureLoader burada KULLANILMIYOR.

        const photoWebsContainer = document.getElementById('photo-webs-container');

        const realWebImages = [
            "https://i.hizliresim.com/av8t7brd.png",
            "https://i.hizliresim.com/xllwx1bt.png",
            "https://i.hizliresim.com/tcbusgul.png",
            "https://i.hizliresim.com/bhocuany.png",
            "https://i.hizliresim.com/bkslqch8.png"
        ];

        let photoWebElements = [];
        let webAnimationTime = 0;

        function shuffleArray(array) {
            const result = [...array];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function randomBetween(a, b) {
            return a + Math.random() * (b - a);
        }

        // Dünya ve ana içerik alanından uzak, kenarlara dağılmış bölgeler.
        // Bölgeler birbirinden ayrı olduğu için ağlar aynı noktaya doğmaz.
        function getWebSpawnZones() {
            const mobile = window.innerWidth < 600;
            return mobile ? [
                {x:[-4,16], y:[-2,24]},
                {x:[84,104], y:[-2,24]},
                {x:[-4,16], y:[74,104]},
                {x:[84,104], y:[74,104]},
                {x:[-8,12], y:[34,64]}
            ] : [
                {x:[-6,20], y:[-4,27]},
                {x:[80,106], y:[-4,27]},
                {x:[-6,20], y:[72,105]},
                {x:[80,106], y:[72,105]},
                {x:[-10,14], y:[33,67]},
                {x:[86,110], y:[33,67]},
                {x:[14,31], y:[-4,19]},
                {x:[69,86], y:[-4,19]}
            ];
        }

        function clearPhotoWebs() {
            photoWebElements.forEach(item => {
                if (item.el && item.el.parentNode) item.el.parentNode.removeChild(item.el);
            });
            photoWebElements = [];
        }

        function createWebElement(src, zone, index) {
            const img = document.createElement('img');
            img.className = 'photo-web-3d';
            img.src = src;
            img.alt = '';
            img.decoding = 'sync';
            img.loading = 'eager';
            img.fetchPriority = 'high';
            img.draggable = false;
            img.setAttribute('aria-hidden', 'true');

            const mobile = window.innerWidth < 600;

            const item = {
                el: img,
                left: randomBetween(zone.x[0], zone.x[1]),
                top: randomBetween(zone.y[0], zone.y[1]),
                depth: randomBetween(-80, 90),

                const rz = Math.sin(t * 0.62) * item.rotate;

        const STREAM_START_TIME = 1700000000;

        function seededShuffle(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;

            const pseudorandom = function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            };

            while (m) {
                i = Math.floor(pseudorandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const totalElapsed = Math.max(0, nowInSeconds - STREAM_START_TIME);

            const cycleIndex = Math.floor(totalElapsed / totalPlaylistDuration);
            const elapsedTime = totalElapsed % totalPlaylistDuration;

            const currentPlaylist = seededShuffle(baseSongList, cycleIndex + 42);

            let accumulatedTime = 0;
            for (let i = 0; i < currentPlaylist.length; i++) {
                if (elapsedTime < accumulatedTime + currentPlaylist[i].duration) {
                    return {
                        playlist: currentPlaylist,
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += currentPlaylist[i].duration;
            }
            return { playlist: currentPlaylist, songIndex: 0, seekTo: 0 };
        }

                if (bassPower > 0.65) {
                    rootStyle.setProperty('--glitch-x', ((Math.random() - 0.5) * 16).toFixed(1) + 'px');
                    rootStyle.setProperty('--glitch-y', ((Math.random() - 0.5) * 8).toFixed(1) + 'px');
                    mainWrapper.classList.add('wrapper-glitch');
                } else {
                    mainWrapper.classList.remove('wrapper-glitch');
                }

                for (let idx = 0; idx < ringBarsCount; idx++) {
                    const bar = ringBarMeshes[idx];
                    const rnd = Math.sin(bassAngle * 3 + idx) * 0.5 + 0.5;
                    const scaleY = 0.25 + rnd * 1.1 * (bassPower + 0.2);
                    
                    const currentRadius = (baseRadius * bassScale) + 0.01;
                    const angle = (idx / ringBarsCount) * Math.PI * 2;
                    bar.position.set(Math.cos(angle) * currentRadius, Math.sin(angle) * currentRadius, 0);

                    bar.scale.set(1, scaleY, 1);
                    bar.material.opacity = 0.6 + rnd * 0.4;
                }

            } else {
                // Yayın başlamadıysa, durmuşsa veya ses kapalıysa BASS = 0.
                // Böylece hiçbir arka plan öğesi patlamaz.
                currentBassPower = 0;
                globeMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 10 * deltaTime);
                dirLight.intensity = 2.2;

                rootStyle.setProperty('--bass-scale', '1');
                rootStyle.setProperty('--bass-glow-scale', '1');
                rootStyle.setProperty('--bass-opacity', '0.4');

                mainWrapper.classList.remove('wrapper-glitch');
                badgeLiveEl.classList.remove('badge-bass-pulse');
                badgeListenerEl.classList.remove('badge-bass-pulse');
                volumeBoxEl.classList.remove('badge-bass-pulse');

                for (let idx = 0; idx < ringBarsCount; idx++) {
                    const bar = ringBarMeshes[idx];
                    const currentRadius = baseRadius + 0.01;
                    const angle = (idx / ringBarsCount) * Math.PI * 2;
                    bar.position.set(Math.cos(angle) * currentRadius, Math.sin(angle) * currentRadius, 0);

                    bar.scale.set(1, 0.25, 1);
                    bar.material.opacity = 0.35;
                }
            }

            animatePhotoWebs(deltaTime);
            renderer.render(scene, camera);
        }

        // Parçacık Tuvali
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resizeThreeJS();
            generateRandomGothicBg();
            generatePhotoWebs();
            
            if (particlesArray.length > 0) {
                particlesArray.forEach(p => {
                    if (p.x > canvas.width || p.y > canvas.height) {
                        p.x = Math.random() * canvas.width;
                        p.y = Math.random() * canvas.height;
                    }
                });
            }
        }
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(handleResize, 120);
        });

        class CyberParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.isFive = Math.random() > 0.65;
                this.size = this.isFive ? Math.random() * 14 + 10 : Math.random() * 2.5 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                
                this.opacity = 0;
                this.maxOpacity = Math.random() * 0.5 + 0.25;
                this.fadeIn = true;
                this.fadeSpeed = Math.random() * 0.008 + 0.003;
            }
            update() {
                const speedMult = isPlayingState ? 1.8 : 0.8;
                this.x += this.speedX * speedMult;
                this.y += this.speedY * speedMult;

                if (this.fadeIn) {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= this.maxOpacity) {
                        this.opacity = this.maxOpacity;
                        this.fadeIn = false;
                    }
                } else {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0) {
                        this.reset();
                    }
                }

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                // Dünya ile aynı bassPower / bassScale kullanılır.
                // isPlayingState false ise currentBassPower zaten 0'dır.
                const bassScale = 1 + currentBassPower * 0.04;
                const bassAlpha = Math.max(0, this.opacity);
                const bassGlow = currentBassPower * 18;

                ctx.save();
                ctx.fillStyle = currentAccentColor;
                ctx.globalAlpha = bassAlpha;

                if (this.isFive) {
                    ctx.font = `900 ${this.size * bassScale}px 'Syne', sans-serif`;
                    ctx.shadowColor = currentAccentColor;
                    ctx.shadowBlur = bassGlow;
                    ctx.fillText("5", this.x, this.y);
                } else {
                    ctx.shadowColor = currentAccentColor;
                    ctx.shadowBlur = bassGlow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * bassScale, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        const particleCount = 50;
        for (let i = 0; i < particleCount; i++) particlesArray.push(new CyberParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particleCount; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            ctx.globalAlpha = 1.0;
            requestAnimationFrame(animateParticles);
        }

        // Başlat
        handleResize();
        requestAnimationFrame(animateGlobe);
        animateParticles();

          messagingSenderId: "43294673357",
          appId: "1:43294673357:web:42dc0b2eefdb3a8a2bdc84",
          measurementId: "G-V1JCFXPLCW"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const listenersRef = db.ref('online_listeners');
        const listenerCountEl = document.getElementById('listener-count');

        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                const myPresenceRef = listenersRef.push();
                myPresenceRef.onDisconnect().remove();
                myPresenceRef.set(true);
            }
        });

        listenersRef.on('value', (snap) => {
            const count = snap.numChildren();
            if (listenerCountEl) {
                listenerCountEl.innerText = count > 0 ? count : 1;
            }
        });
    </script>
